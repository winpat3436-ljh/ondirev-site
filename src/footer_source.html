(function(){

<script>
(function(){
  var path=location.pathname.toLowerCase().replace(/\/+$/,"") || "/";
  var isDetail = (/[?&]idx=\d+/.test(location.search) && document.body.classList.contains("shop_view"));                                     /* 상품 상세 */
  var isList = !isDetail && (path==='/'||path==='/products'||path==='/prdouct'||path==='/in'||path==='/home');   /* 상품 목록 */
  if(!isDetail && !isList) return;
  /* 상품명에 들어 있는 글자 → 붙일 태그 */
  var TAGS = [ { match:/리플\s*엑토인\s*세럼/, tags:["속보습","수분 유지"] } ];
  var UP = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 10V2.5M2.8 5.6 6 2.4l3.2 3.2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function tagBox(rule){ var box=document.createElement("div"); box.className="od-ptags"; box.innerHTML=rule.tags.map(function(x){ return '<span class="od-ptag">'+x+UP+'</span>'; }).join(""); return box; }
  /* 상세: 상품명 아래에만 (화면에 실제로 보이는 것 중 글씨가 가장 크고 위쪽에 있는 것). 상품명은 굵게 바꾸지 않음 */
  function shown(el){
    var r=el.getBoundingClientRect(); if(r.width<=0 || r.height<=0 || r.right<=0 || r.left>=window.innerWidth) return false;   /* 화면 가로 밖(숨겨 둔 다른 기기용 영역) 제외 */
    for(var a=el;a&&a!==document.body;a=a.parentElement){ var cs=getComputedStyle(a); if(cs.display==="none"||cs.visibility==="hidden"||cs.opacity==="0") return false; }
    return true;
  }
  /* 상세: 화면에 보이는 상품명 중 맨 위(메인 상품명) 바로 아래에 태그. 그 아래 반복되는 짧은 상품명(간단 설명)은 숨김 */
  function runDetail(){
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n,list=[];
    while((n=w.nextNode())){
      var el=n.parentElement; if(!el || /^(SCRIPT|STYLE|TITLE)$/.test(el.tagName) || el.closest("nav,.mobile_slide_menu_container,.od-ptags,.od-buybar,.od-mbuy,.ondirev-root,.odpx,.odpx-ev,.odv2")) continue;
      var t=n.nodeValue.trim(); if(!t || t.length>40) continue;
      var rule=null; TAGS.forEach(function(r){ if(r.match.test(t)) rule=r; }); if(!rule || !shown(el)) continue;
      list.push({el:el, rule:rule, top:el.getBoundingClientRect().top+window.scrollY});
    }
    if(!list.length) return 0;
    list.sort(function(a,b){ return a.top-b.top; });
    var main=list[0];
    /* 태그: 메인 상품명 바로 아래 (이미 있으면 그대로) */
    var cur=document.querySelector('[data-od-pn="d"]');
    if(cur!==main.el){
      if(cur){ cur.removeAttribute("data-od-pn"); var nb=cur.nextElementSibling; if(nb && nb.classList.contains("od-ptags")) nb.remove(); }
      main.el.setAttribute("data-od-pn","d");
      var box=tagBox(main.rule); box.style.margin="0 0 18px";   /* 판매가와는 18px 띄움 */
      main.el.insertAdjacentElement("afterend", box);
    }
    /* 상품명과는 8px: 실제 간격을 재서 상품명 아래 여백이 커도 끌어올림 */
    var tb=main.el.nextElementSibling;
    if(tb && tb.classList.contains("od-ptags")){
      var gap=tb.getBoundingClientRect().top - main.el.getBoundingClientRect().bottom;
      var mt=parseFloat(tb.style.marginTop)||0;
      if(Math.abs(gap-8)>1) tb.style.marginTop=(mt + 8 - gap)+"px";
    }
    /* 메인 상품명 아래 600px 안에서 반복되는 상품명(간단 설명) 숨김 */
    list.slice(1).forEach(function(o){
      if(o.top-main.top<600){
        var x=o.el; while(x.parentElement && x.parentElement!==document.body && txt2(x.parentElement)===txt2(o.el)) x=x.parentElement;
        x.style.setProperty("display","none","important");
      }
    });
    return 1;
  }
  function txt2(el){ return (el.textContent||"").replace(/\s+/g,""); }
  function run(){
    if(isDetail) return runDetail();
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n,done=0;
    while((n=w.nextNode())){
      var el=n.parentElement; if(!el || /^(SCRIPT|STYLE)$/.test(el.tagName) || el.closest("header,nav,.mobile_slide_menu_container,.od-ptags,.odv2")) continue;
      var t=n.nodeValue.trim(); if(t.length>40) continue;
      var rule=null; TAGS.forEach(function(r){ if(r.match.test(t)) rule=r; }); if(!rule) continue;
      if(el.getAttribute("data-od-pn")) continue;
      var hero = parseFloat(getComputedStyle(el).fontSize) >= 24;   /* 비주얼의 큰 제목 */
      el.setAttribute("data-od-pn", hero ? "h" : "1");
      if(!hero) el.classList.add("od-pname-b");
      var box=document.createElement("div"); box.className="od-ptags"+(hero?" is-hero":"");
      box.innerHTML=rule.tags.map(function(x){ return '<span class="od-ptag">'+x+UP+'</span>'; }).join("");
      el.insertAdjacentElement("afterend", box); done++;
      if(hero) heroes.push({el:el, box:box});
    }
    return done;
  }
  /* 비주얼 태그는 제목의 슬라이드업 효과를 그대로 따라감 (제목이 다시 올라올 때도 같이) */
  var heroes=[], syncing=false;
  function sync(){
    if(!heroes.length){ syncing=false; return; }   /* 비주얼 제목이 없는 페이지에선 쉬게 함 */
    heroes.forEach(function(h){
      var src=h.el;
      for(var a=h.el;a&&a!==document.body;a=a.parentElement){ if(a.classList.contains("od-up")||getComputedStyle(a).opacity!=="1"){ src=a; break; } }
      var cs=getComputedStyle(src);
      if(src!==h.el && h.box.parentElement && src.contains(h.box)){ h.box.style.opacity=""; h.box.style.transform=""; return; }
      h.box.style.opacity=cs.opacity;
      h.box.style.transform=(cs.transform && cs.transform!=="none")?cs.transform:"";
    });
    requestAnimationFrame(sync);
  }
  /* 아임웹이 늦게 그리거나 다시 그려도 15초 동안 계속 확인해서 붙여 둠 */
  var tries=0, t=setInterval(function(){ run(); if(heroes.length && !syncing){ syncing=true; requestAnimationFrame(sync); } if(++tries>=75) clearInterval(t); },200);
})();
</script>

<script>
(function(){
  /* ===== 설정: 항목·문구는 여기서만 수정 ===== */
  var OD_REVIEW = {
    scales: [   /* 필수 3단계 평가 (왼쪽 → 오른쪽) */
      { key:"촉촉함",     title:"촉촉함은 어떤가요?",    opts:["건조해요","보통이에요","촉촉해요"] },
      { key:"트러블케어", title:"트러블케어가 되었나요?", opts:["별로예요","잘 모르겠어요","아주 좋아요"] },
      { key:"흡수력",     title:"흡수력은 어떤가요?",    opts:["별로예요","괜찮아요","아주 만족해요"] }
    ],
    skinType: { key:"피부타입", title:"내 피부 타입", opts:["건성","중성","복합성","지성","수부지"], multi:false },
    concerns: { key:"고민", title:"요즘 피부 고민", multi:true, max:3,
      opts:["건조","속당김","각질","모공","피지","민감","장벽","탄력","홍조","열감","트러블","아토피"] }
  };
  window.OD_REVIEW_CFG = OD_REVIEW;   /* 리뷰 작성 창 통합에서 같은 설정 사용 */
  var TAG_RE = /\[평가:\s*([^\]]+)\]\s*/;

  function esc(s){ return String(s).split(String.fromCharCode(38)).join(String.fromCharCode(38)+"amp;").split("<").join(String.fromCharCode(38)+"lt;").split(">").join(String.fromCharCode(38)+"gt;").split('"').join(String.fromCharCode(38)+"quot;"); }
  function visible(el){ if(!el) return false; var r=el.getBoundingClientRect(); return r.width>0 && r.height>0; }
  function parseTag(str){
    var m=TAG_RE.exec(str||""); if(!m) return null; var out={};
    m[1].split(" / ").forEach(function(p){ p=p.trim(); var i=p.indexOf(" "); if(i>0) out[p.slice(0,i)]=p.slice(i+1).trim(); });
    return out;
  }
  function buildTag(sel){
    var parts=[];
    OD_REVIEW.scales.forEach(function(q){ if(sel[q.key]) parts.push(q.key+" "+sel[q.key]); });
    if(sel[OD_REVIEW.skinType.key]) parts.push(OD_REVIEW.skinType.key+" "+sel[OD_REVIEW.skinType.key]);
    var c=sel[OD_REVIEW.concerns.key]; if(c && c.length) parts.push(OD_REVIEW.concerns.key+" "+c.join(", "));
    return "[평가: "+parts.join(" / ")+"]";
  }

  /* ---------- 작성 창 ---------- */
  function getText(ed){ return ed.tagName==="TEXTAREA" ? ed.value : ed.innerText; }
  function setText(ed, v){
    if(ed.tagName==="TEXTAREA"){ Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,"value").set.call(ed, v); }
    else{ ed.innerHTML = v.split("\n").map(function(l){ return "<p>"+(esc(l)||"<br>")+"</p>"; }).join(""); }
    ["input","change","keyup"].forEach(function(t){ ed.dispatchEvent(new Event(t,{bubbles:true})); });
  }
  function reviewScope(ed){
    var box=ed, d=0;
    while(box && box!==document.body && d<9){
      if(/구매평|리뷰|후기|상품평/.test(box.textContent||"") && box.querySelector("button, a, input[type=submit]")) return box;
      box=box.parentElement; d++;
    }
    return null;
  }
  function findEditors(){
    return [].slice.call(document.querySelectorAll("textarea, [contenteditable='true']")).filter(function(ed){
      if(ed.closest(".odrv") || ed.getAttribute("data-odrv") || !visible(ed)) return false;
      /* 남의 리뷰를 열었을 때 나오는 "댓글" 입력칸은 제외 */
      if(/comment/i.test(ed.id||"") || ed.closest('[class*="comment"], [id*="comment"], li.list_review_inner')) return false;
      /* 아임웹 리뷰 작성 창은 아래 "리뷰 작성 창 통합"에서 처리 */
      if(ed.id==="review_modal_body" || ed.closest(".modal_add_review")) return false;
      return !!reviewScope(ed);
    });
  }

  function makeForm(ed){
    var C=OD_REVIEW.concerns, S=OD_REVIEW.skinType;
    var sel={}; sel[C.key]=[];
    var wrap=document.createElement("div"); wrap.className="odrv";
    var h='<div class="odrv-hd"><div class="odrv-en">Direction Note</div><div class="odrv-h">내 피부에서 어떻게 작용했나요?</div><div class="odrv-hs">필수 항목 3개를 선택해 주세요.</div></div>';
    OD_REVIEW.scales.forEach(function(q){
      h+='<div class="odrv-q" data-k="'+esc(q.key)+'"><div class="odrv-t">'+esc(q.title)+'<span class="odrv-req">필수</span></div><div class="odrv-scale">';
      q.opts.forEach(function(o){ h+='<button type="button" class="odrv-opt" data-v="'+esc(o)+'"><span class="odrv-dot"></span><span class="odrv-lb">'+esc(o)+'</span></button>'; });
      h+='</div></div>';
    });
    h+='<div class="odrv-sec"><div class="odrv-qt"><b>'+esc(S.title)+'<small>선택</small></b></div><div class="odrv-pills" data-k="'+esc(S.key)+'">';
    S.opts.forEach(function(o){ h+='<button type="button" class="odrv-pill" data-v="'+esc(o)+'">'+esc(o)+'</button>'; });
    h+='</div><div class="odrv-qt"><b>'+esc(C.title)+'<small>선택 · 최대 '+C.max+'개</small></b></div><div class="odrv-pills" data-k="'+esc(C.key)+'">';
    C.opts.forEach(function(o){ h+='<button type="button" class="odrv-pill" data-v="'+esc(o)+'">'+esc(o)+'</button>'; });
    h+='</div></div><div class="odrv-msg">필수 항목을 모두 선택해 주세요.</div>';
    wrap.innerHTML=h;

    function refresh(){
      OD_REVIEW.scales.forEach(function(q){
        var row=wrap.querySelector('.odrv-q[data-k="'+q.key+'"]');
        [].forEach.call(row.querySelectorAll(".odrv-opt"),function(b){ b.classList.toggle("on", b.getAttribute("data-v")===sel[q.key]); });
        if(sel[q.key]) row.classList.remove("err");
      });
      [S,C].forEach(function(g){
        var v=sel[g.key], arr=g.multi?(v||[]):(v?[v]:[]);
        [].forEach.call(wrap.querySelectorAll('.odrv-pills[data-k="'+g.key+'"] .odrv-pill'),function(p){ p.classList.toggle("on", arr.indexOf(p.getAttribute("data-v"))>-1); });
      });
      if(OD_REVIEW.scales.every(function(q){return sel[q.key];})) wrap.querySelector(".odrv-msg").classList.remove("show");
    }
    wrap.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      e.preventDefault(); e.stopPropagation();
      if(b.classList.contains("odrv-opt")){ sel[b.closest(".odrv-q").getAttribute("data-k")]=b.getAttribute("data-v"); }
      else if(b.classList.contains("odrv-pill")){
        var k=b.parentElement.getAttribute("data-k"), v=b.getAttribute("data-v");
        if(k===S.key) sel[k]= sel[k]===v ? "" : v;
        else{ var a=sel[k], i=a.indexOf(v); if(i>-1) a.splice(i,1); else if(a.length<C.max) a.push(v); }
      }
      refresh();
    });

    var cur=getText(ed), old=parseTag(cur);
    if(old){
      OD_REVIEW.scales.forEach(function(q){ if(old[q.key]) sel[q.key]=old[q.key]; });
      if(old[S.key]) sel[S.key]=old[S.key];
      if(old[C.key]) sel[C.key]=old[C.key].split(/\s*,\s*/);
      setText(ed, cur.replace(TAG_RE,""));
    }
    refresh();
    ed.setAttribute("data-odrv","1");

    /* 설문은 작은 창(팝업)으로 띄우고, 작성 창에는 요약 칩만 둠 */
    var ov=document.createElement("div"); ov.className="odrv-ov";
    var box=document.createElement("div"); box.className="odrv-box";
    box.innerHTML='<button type="button" class="odrv-x" aria-label="닫기"></button>';
    box.appendChild(wrap);
    var foot=document.createElement("div"); foot.className="odrv-foot";
    foot.innerHTML='<button type="button" class="odrv-done">선택 완료</button>';
    box.appendChild(foot); ov.appendChild(box); document.body.appendChild(ov);

    var chip=document.createElement("div"); chip.className="odrv-chip";
    var anchor = ed.tagName==="TEXTAREA" ? ed : (ed.closest("[class*='editor'], [class*='Editor']")||ed);
    anchor.parentNode.insertBefore(chip, anchor);

    function summary(){
      var a=OD_REVIEW.scales.filter(function(q){ return sel[q.key]; }).map(function(q){ return sel[q.key]; });
      if(a.length<OD_REVIEW.scales.length){ chip.classList.add("empty"); chip.innerHTML='<span class="en">Direction Note</span><span class="sm">필수 항목 3개를 선택해 주세요</span><span class="ed">선택하기</span>'; }
      else{ chip.classList.remove("empty"); chip.innerHTML='<span class="en">Direction Note</span><span class="sm">'+esc(a.join(" · "))+'</span><span class="ed">수정</span>'; }
    }
    function openNote(){ ov.classList.add("show"); }
    function closeNote(){ ov.classList.remove("show"); summary(); }
    chip.addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); openNote(); });
    box.querySelector(".odrv-x").addEventListener("click", function(e){ e.preventDefault(); e.stopPropagation(); closeNote(); });
    ov.addEventListener("click", function(e){ if(e.target===ov) closeNote(); });
    foot.querySelector(".odrv-done").addEventListener("click", function(e){
      e.preventDefault(); e.stopPropagation();
      var missing=OD_REVIEW.scales.filter(function(q){ return !sel[q.key]; });
      if(missing.length){
        missing.forEach(function(q){ wrap.querySelector('.odrv-q[data-k="'+q.key+'"]').classList.add("err"); });
        wrap.querySelector(".odrv-msg").classList.add("show");
        return;
      }
      closeNote();
    });
    /* 작성 창이 닫히면 팝업도 정리 */
    var watch=setInterval(function(){ if(!document.body.contains(ed)){ clearInterval(watch); if(ov.parentNode) ov.parentNode.removeChild(ov); } }, 500);
    summary();
    setTimeout(openNote, 250);

    function beforeSubmit(e){
      var missing=OD_REVIEW.scales.filter(function(q){ return !sel[q.key]; });
      if(missing.length){
        e.preventDefault(); e.stopImmediatePropagation();
        missing.forEach(function(q){ wrap.querySelector('.odrv-q[data-k="'+q.key+'"]').classList.add("err"); });
        wrap.querySelector(".odrv-msg").classList.add("show");
        openNote();
        return false;
      }
      setText(ed, buildTag(sel)+"\n"+getText(ed).replace(TAG_RE,""));
    }
    var scope=reviewScope(ed)||document.body;
    var SUBMIT_RE=/^(등록|등록하기|작성|작성하기|작성\s*완료|완료|저장|수정|수정하기|(구매평|리뷰|후기)\s*(등록|작성)(하기)?)$/;
    scope.addEventListener("click",function(e){
      var b=e.target.closest("button, a, input[type=submit]"); if(!b || b.closest(".odrv, .odrv-chip, .odrv-ov")) return;
      if(SUBMIT_RE.test((b.value||b.textContent||"").replace(/\s+/g," ").trim())) beforeSubmit(e);
    }, true);
    var form=ed.closest("form"); if(form) form.addEventListener("submit", beforeSubmit, true);
  }

  /* ---------- 목록 표시 ---------- */
  function renderView(data){
    var h="";
    OD_REVIEW.scales.forEach(function(q){ if(data[q.key]) h+='<span class="it"><b>'+esc(q.key)+'</b><span>'+esc(data[q.key])+'</span></span>'; });
    var st=data[OD_REVIEW.skinType.key], cs=data[OD_REVIEW.concerns.key]?data[OD_REVIEW.concerns.key].split(/\s*,\s*/).filter(Boolean):[];
    if(st || cs.length) h+='<span class="it skin"><b>피부</b><span class="sk">'+(st?'<i class="t">'+esc(st)+'</i>':'')+cs.map(function(c){ return '<i class="k">'+esc(c)+'</i>'; }).join("")+'</span></span>';
    var div=document.createElement("div"); div.className="odrv-view"; div.innerHTML=h; return div;
  }
  /* 줄이 바뀐 항목 앞의 점 숨김 */
  function fixWrap(v){
    requestAnimationFrame(function(){
      var its=v.querySelectorAll(".it");
      [].forEach.call(its,function(it){ it.classList.remove("nl"); });
      [].forEach.call(its,function(it,i){ if(i>0 && it.offsetTop>its[i-1].offsetTop+2) it.classList.add("nl"); });
    });
  }
  window.addEventListener("resize",function(){ [].forEach.call(document.querySelectorAll(".odrv-view"),fixWrap); });
  function scanList(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n, hits=[];
    while((n=w.nextNode())){
      var p=n.parentElement; if(!p || /^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName) || p.isContentEditable || p.closest(".odrv, .odrv-view")) continue;
      if(n.nodeValue.indexOf("[평가:")>-1 && TAG_RE.test(n.nodeValue)) hits.push(n);
    }
    hits.forEach(function(n){
      var data=parseTag(n.nodeValue); if(!data) return;
      n.nodeValue=n.nodeValue.replace(TAG_RE,"");
      var nx=n.nextSibling; if(!n.nodeValue.trim() && nx && nx.nodeName==="BR") nx.parentNode.removeChild(nx);
      var block=n.parentElement;
      while(block && getComputedStyle(block).display==="inline" && block.parentElement) block=block.parentElement;
      if(block.previousElementSibling && block.previousElementSibling.classList.contains("odrv-view")) return;
      var vw=renderView(data); block.parentNode.insertBefore(vw, block); fixWrap(vw);
    });
  }

  function tick(){ try{ findEditors().forEach(makeForm); scanList(); }catch(e){} }
  var t=null;
  new MutationObserver(function(){ if(t) return; t=setTimeout(function(){ t=null; tick(); },150); }).observe(document.documentElement,{childList:true, subtree:true});
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", tick); else tick();
})();
</script>

<script>
(function(){
  var isDetail = (/[?&]idx=\d+/.test(location.search) && document.body.classList.contains("shop_view"));
  var path = location.pathname.toLowerCase().replace(/\/+$/,"") || "/";
  var isList = !isDetail && (path==='/'||path==='/products'||path==='/prdouct'||path==='/in'||path==='/home');

  /* ---------- 공통 ---------- */
  var STAR_PATH="M12 2.6l2.83 5.74 6.33.92-4.58 4.47 1.08 6.3L12 17.05 6.34 20.03l1.08-6.3L2.84 9.26l6.33-.92z";
  var uid=0;
  function starSVG(fill){ /* fill: 0~1 */
    var id="ods"+(++uid);
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="'+id+'"><rect x="0" y="0" width="'+(24*fill)+'" height="24"/></clipPath></defs>'+
      '<path d="'+STAR_PATH+'" fill="#D6E1EC" stroke="#D6E1EC" stroke-width="1.2" stroke-linejoin="round"/>'+
      '<path d="'+STAR_PATH+'" fill="#4B86B4" stroke="#4B86B4" stroke-width="1.2" stroke-linejoin="round" clip-path="url(#'+id+')"/></svg>';
  }
  function starsHTML(v){ var h=""; for(var i=0;i<5;i++) h+=starSVG(Math.max(0,Math.min(1,v-i))); return h; }
  function vis(el){ var r=el.getBoundingClientRect(); return r.width>0 && r.height>0; }
  function rgb(c){ var m=/rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)/.exec(c||""); return m?[+m[1],+m[2],+m[3]]:null; }
  function isWarm(el){
    var cs=getComputedStyle(el), cands=[cs.color, cs.fill, cs.backgroundColor];
    var sub=el.querySelector("svg path, svg, i, span"); if(sub){ var s2=getComputedStyle(sub); cands.push(s2.color, s2.fill, s2.backgroundColor); }
    return cands.some(function(c){ var v=rgb(c); return v && v[0]>170 && v[1]<150 && v[2]<150 && v[0]-v[1]>60; });
  }

  /* ---------- 1) "구매평" → "리뷰" ---------- */
  function rename(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n;
    while((n=w.nextNode())){
      var p=n.parentElement; if(!p || /^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(p.tagName) || p.isContentEditable) continue;
      if(n.nodeValue.indexOf("구매평")>-1 && n.nodeValue.indexOf("[평가:")<0){
        n.nodeValue=n.nodeValue.replace(/구매평\s*작성/g,"리뷰 작성")
          .replace(/구매평은/g,"리뷰는").replace(/구매평을/g,"리뷰를").replace(/구매평이/g,"리뷰가")
          .replace(/구매평과/g,"리뷰와").replace(/구매평으로/g,"리뷰로").replace(/구매평/g,"리뷰");
      }
    }
  }

  /* 작성 불가 안내창 문구 (맞춤법 보정 + 안내 개선) */
  var NOTICE_RE=/(리뷰|구매평)\s*작성이\s*가능한\s*주문이\s*존재하지\s*않습니다/;
  var NOTICE_TXT="아직 리뷰를 남길 수 있는 주문이 없어요.\n상품을 구매하시면 주문할 때마다 리뷰를 남길 수 있어요. (주문 1건당 상품별 1회)\n작성한 리뷰는 삭제 후 다시 작성할 수 없으니 신중하게 남겨 주세요.";
  function fixNotice(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n, hits=[];
    while((n=w.nextNode())){ if(NOTICE_RE.test(n.nodeValue) || /리뷰은|구매평은/.test(n.nodeValue)) hits.push(n); }
    hits.forEach(function(n){
      if(NOTICE_RE.test(n.nodeValue)){
        var p=n.parentElement; p.style.whiteSpace="pre-line"; p.style.lineHeight="1.7";
        n.nodeValue=NOTICE_TXT;
        /* 같은 문단에 남은 뒷문장(…1번만 작성이 가능하며…) 정리 */
        var nx=n.nextSibling; while(nx){ var nn=nx.nextSibling; if(nx.nodeType===3 || nx.nodeName==="BR") nx.parentNode.removeChild(nx); nx=nn; }
      } else {
        n.nodeValue=n.nodeValue.replace(/리뷰은/g,"리뷰는");
      }
    });
  }

  /* ---------- 탭(리뷰 · 상세정보 · Q&A) 브랜드 디자인 ---------- */
  function styleTabs(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n;
    while((n=w.nextNode())){
      if(!/^\s*상세\s*정보\s*$/.test(n.nodeValue) || !vis(n.parentElement)) continue;
      var item=n.parentElement, bar=null;
      for(var a=item, d=0; a && a!==document.body && d<5; a=a.parentElement, d++){
        var kids=[].slice.call(a.children).filter(vis);
        var t=(a.textContent||"").replace(/\s+/g,"");
        if(kids.length>=2 && kids.length<=5 && /(리뷰|구매평)/.test(t) && /Q&A|Q＆A|문의/.test(t)){ bar=a; break; }
      }
      if(!bar) continue;
      if(!bar.classList.contains("odtab")){
        /* 디자인 덮어쓰기 전에 아임웹 원래 배경색을 기록 (활성 탭 판단용) */
        [].forEach.call(bar.children,function(c){ if(!c.getAttribute("data-odbg")) c.setAttribute("data-odbg", getComputedStyle(c).backgroundColor); });
        bar.classList.add("odtab");
      }
      [].forEach.call(bar.children,function(c){
        if(!vis(c)) return;
        c.classList.add("odtab-i");
        /* 숫자 (1) → 작은 배지 */
        var tw=document.createTreeWalker(c, NodeFilter.SHOW_TEXT), x, list=[];
        while((x=tw.nextNode())) list.push(x);
        list.forEach(function(x){
          var m=/^(.*?)\s*\(\s*(\d+)\s*\)\s*$/.exec(x.nodeValue); if(!m || x.parentElement.classList.contains("odtab-n")) return;
          x.nodeValue=m[1];
          var b=document.createElement("span"); b.className="odtab-n"; b.textContent=m[2];
          x.parentNode.insertBefore(b, x.nextSibling);
        });
      });
      /* 활성 탭은 하나만: ① 아임웹이 칠해 둔 배경색이 혼자 다른 탭 ② 탭 줄 바로 뒤 내용 ③ 클래스 순서로 판단 */
      if(!bar.getAttribute("data-odtab-set")){
        var items=[].slice.call(bar.querySelectorAll(":scope > .odtab-i")), pick=null;
        var bgs=items.map(function(c){ return c.getAttribute("data-odbg") || (c.setAttribute("data-odbg", getComputedStyle(c).backgroundColor), c.getAttribute("data-odbg")); });
        var uniq=bgs.filter(function(v,i){ return bgs.indexOf(v)===i; });
        if(uniq.length===2){
          var odd=uniq.filter(function(v){ return bgs.filter(function(x){return x===v;}).length===1; });
          if(odd.length===1 && !/rgba\(0, 0, 0, 0\)|transparent/.test(odd[0])) pick=items[bgs.indexOf(odd[0])];
        }
        if(!pick){
          var nextTxt="", el=bar, stop=false;
          while(el && !stop && nextTxt.length<300 && el!==document.body){
            var sib=el.nextElementSibling;
            while(sib && nextTxt.length<300){
              var tx=(sib.textContent||"");
              if(/상세\s*정보/.test(tx) && /Q\s*&\s*A/.test(tx) && tx.length<80){ stop=true; break; }   /* 다음 탭 줄에서 멈춤 */
              nextTxt+=" "+tx; sib=sib.nextElementSibling;
            }
            el=el.parentElement;
          }
          var want = /실제\s*구매|포토\s*(리뷰|구매평)|(리뷰|구매평)\s*\(\s*\d/.test(nextTxt) ? "rv" : /Q\s*&\s*A\s*\(|상품\s*문의|문의하기/.test(nextTxt) ? "qa" : "dt";
          pick=items.filter(function(c){ var t=(c.textContent||"").replace(/\s+/g,"");
            return want==="rv" ? /리뷰|구매평/.test(t) : want==="qa" ? /Q&A|Q＆A|문의/.test(t) : /상세/.test(t); })[0];

  /* 리뷰 사진 썸네일 찾기: 리뷰 영역 안의 작은 정사각형 이미지(사진 칸) */

  function nativeStats(){
    var tables=[].slice.call(document.querySelectorAll(".review_summary_wrap .summary_table, .review_summary_wrap_mobile .summary_table, .summary_table"));

  function activeFilterText(sec){

  function runDetail(){

       · 별점 필터·포토 필터가 걸린 상태에서는 절대 새로 계산하지 않음
       · 필터 없이 계산한 값은 이 기기에 저장 → 필터를 건 채로 새로 열려도 저장된 전체 평점을 보여줌 */
    /* ── 1순위: 아임웹 기본 평점 상자(숨겨 둠)의 "전체 리뷰" 값 사용 ──
       (총 N개의 리뷰) · 평균 · 5점~1점 막대 높이 → 페이지와 상관없이 전체 리뷰 기준 */
    var nat=nativeStats();
    if(nat){
      var nkey=JSON.stringify([nat.dist,nat.total,nat.avg]);
      if(box._key!==nkey){ box._key=nkey; fill(box,nat); if(box._done) animate(box,true); }
      box._locked=true;
      return;
    }
    var KEY="od_rs_"+((/[?&]idx=(\d+)/.exec(location.search)||[])[1]||location.pathname);
    function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } }
    function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
    if(!box._init){ box._init=true; var c=load(); if(c){ box._key=JSON.stringify([c.dist,c.total,c.avg]); fill(box,c); if(box._done) animate(box,true); } }
    if(box._locked) return;
    var filtered = labelFiltered(f) || n < Math.min(total,5) || /포토\s*(리뷰|구매평)만\s*보기/.test(activeFilterText(f.sec)) || /[?&](rating|review_rating|score|star|photo)/i.test(location.search);
    if(filtered) return;
    var data={dist:dist, n:n, total:total, avg:Math.round(avg*10)/10, partial: total>n};
    var key=JSON.stringify([dist,total,data.avg]);
    if(box._key!==key){ box._key=key; fill(box,data); if(box._done) animate(box,true); }
    if(n>0 || total===0){ save(data); box._locked=true; }
  }

  /* ---------- 4) 목록: 할인가 굵게 ---------- */
  function runList(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n;
    while((n=w.nextNode())){
      var p=n.parentElement; if(!p || p.classList.contains("od-saleprice") || /^(SCRIPT|STYLE)$/.test(p.tagName)) continue;
      if(!/^\s*[\d,]+\s*원\s*$/.test(n.nodeValue)) continue;
      var cs=getComputedStyle(p); if(/line-through/.test(cs.textDecorationLine||cs.textDecoration)) continue;
      if(p.closest("del, s, strike")) continue;
      /* 같은 줄(부모 2단계 안)에 할인율 %가 있는 가격만 */
      var row=p.parentElement, ok=false;
      for(var i=0;i<2 && row;i++,row=row.parentElement){ if(/\d+\s*%/.test(row.textContent||"") && (row.textContent||"").length<40){ ok=true; break; } }
      if(ok) p.classList.add("od-saleprice");
    }
  }

  var t=null;
  function tick(){ try{ if(isDetail) runDetail(); if(isList) runList(); }catch(e){} }
  new MutationObserver(function(muts){
    /* 새로 생기거나 보이게 된 별은 화면에 그려지기 전에 바로 교체 → 빨간 별 깜빡임 없음 */
    if(isDetail){
      var roots=[];
      muts.forEach(function(m){
        var skip=function(el){ return el.nodeType!==1 || el===document.body || el===document.documentElement || el.closest(".odst, .odrs, .odrv, .odrf, .odtab, #od-kakao, .odrv-view") || el.getElementsByTagName("*").length>600; };
        if(m.type==="childList") [].forEach.call(m.addedNodes,function(nd){ if(!skip(nd)) roots.push(nd); });
        else if(!skip(m.target)) roots.push(m.target);
      });
      if(roots.length){ roots.forEach(function(r){ try{ findGroups(r).forEach(restyle); }catch(e){} }); try{ cleanDropdown(); }catch(e){} }
    }
    if(t) return; t=setTimeout(function(){ t=null; tick(); },200);
  }).observe(document.documentElement,{childList:true, subtree:true, attributes:true, attributeFilter:["style","class"]});
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", tick); else tick();
  var k=0, iv=setInterval(function(){ tick(); if(++k>40) clearInterval(iv); },500);
})();
</script>

<!-- ============================================================
     목록 가격 정리
     · 회원가 줄(16% 26,800원 회원가)이 붙은 카드는 아래 중복되는 기본 할인가 줄을 숨김
     · 회원가 줄이 없는 경우(로그인 회원 등)엔 기본 할인가 줄을 짙고 굵게
     ============================================================ -->
<style>
  .od-pricefix{ font-weight:700 !important; }
  .od-pricefix, .od-pricefix *{ color:#1E2A3A !important; -webkit-text-fill-color:#1E2A3A !important; font-weight:700 !important; }
  .od-pricefix .od-pct{ color:#E03131 !important; -webkit-text-fill-color:#E03131 !important; }
</style>
<script>
(function(){
  var path=location.pathname.toLowerCase().replace(/\/+$/,"") || "/";
  if(/[?&]idx=\d+/.test(location.search)) return;
  if(!(path==='/'||path==='/products'||path==='/prdouct'||path==='/in'||path==='/home')) return;
  var RE=/^\s*\d+\s*%\s*[\d,]+\s*원\s*$/;
  /* 같은 상품 카드(또는 바로 위쪽 형제들)에 회원가 줄이 있는지 */
  function nearMember(el){
    for(var a=el, d=0; a && a!==document.body && d<5; a=a.parentElement, d++){
      if(a.querySelector && a.querySelector("[data-mh]")) return true;
      var s=a.previousElementSibling, k=0;
      while(s && k<4){ if(s.hasAttribute("data-mh") || (s.querySelector && s.querySelector("[data-mh]"))) return true; s=s.previousElementSibling; k++; }
    }
    return false;
  }
  function run(){
    /* 기본 할인가 줄: "16% 26,800원"만 들어 있는 가장 작은 요소 (회원가 줄 제외) */
    var all=document.body.querySelectorAll("p,div,span,li,strong,em,b");
    [].forEach.call(all,function(el){
      if(el.closest("[data-mh]") || el.hasAttribute("data-odpf")) return;
      var t=(el.textContent||"").replace(/\s+/g," ");
      if(!RE.test(t)) return;
      /* 더 작은 자식이 같은 내용이면 자식 쪽에서 처리 */
      for(var i=0;i<el.children.length;i++){ if(RE.test((el.children[i].textContent||"").replace(/\s+/g," "))) return; }
      el.setAttribute("data-odpf","1");
      /* 같은 상품 카드 안에 회원가 줄이 있으면 숨김 */
      if(nearMember(el)){ el.style.setProperty("display","none","important"); return; }
      el.classList.add("od-pricefix");
      /* 할인율 숫자는 빨간색 유지 */
      var tw=document.createTreeWalker(el, NodeFilter.SHOW_TEXT), n;
      while((n=tw.nextNode())){ if(/^\s*\d+\s*%\s*$/.test(n.nodeValue) && n.parentElement!==el) n.parentElement.classList.add("od-pct"); }
    });
    /* 회원가 줄이 늦게 붙은 경우: 이미 진하게 처리한 줄도 다시 확인해서 숨김 */
    [].forEach.call(document.querySelectorAll(".od-pricefix"),function(el){
      if(nearMember(el)) el.style.setProperty("display","none","important");
    });
  }
  var k=0, t=setInterval(function(){ run(); if(++k>=40) clearInterval(t); },250);
})();
</script>

<!-- ============================================================
     결제 페이지: "휴대폰결제" 숨김 (KG 휴대폰결제 계약 전까지 임시)
     · 계약이 끝나면 이 블록 전체를 지우면 원래대로 돌아옴
     · 휴대폰결제가 기본 선택돼 있으면 자동으로 "신용카드"로 바꿈
     ============================================================ -->
<script>
(function(){
  var BLOCK=/^\s*휴대폰\s*결제\s*$/;
  function run(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n, hits=[];
    while((n=w.nextNode())){ if(BLOCK.test(n.nodeValue)) hits.push(n.parentElement); }
    hits.forEach(function(el){
      /* 이 결제수단의 선택 버튼(라디오)이 들어 있는 가장 작은 줄 */
      var row=el, d=0;
      while(row && row!==document.body && d<5 && !row.querySelector('input[type="radio"]')){ row=row.parentElement; d++; }
      if(!row || row===document.body || !row.querySelector('input[type="radio"]')) return;
      if(row.querySelectorAll('input[type="radio"]').length>1) return;   /* 다른 결제수단까지 묶인 상자는 건드리지 않음 */
      var radio=row.querySelector('input[type="radio"]');
      /* 이 결제수단 하나만 감싼 가장 바깥 상자까지 올라가서 통째로 숨김 */
      while(row.parentElement && row.parentElement!==document.body && row.parentElement.querySelectorAll('input[type="radio"]').length===1) row=row.parentElement;
      radio.disabled=true;
      row.style.setProperty("display","none","important");
      /* 휴대폰결제가 선택돼 있으면 같은 그룹의 다른 결제수단(신용카드 우선)으로 변경 */
      if(radio.checked){
        var group=radio.name ? document.querySelectorAll('input[type="radio"][name="'+radio.name+'"]') : [];
        var pick=null;
        [].forEach.call(group,function(r){
          if(r===radio || r.disabled) return;
          var lab=(r.closest("label,li,div")||r).textContent||"";
          if(!pick || /신용\s*카드/.test(lab)) pick = (/신용\s*카드/.test(lab) || !pick) ? r : pick;
        });
        if(pick){ pick.click(); if(!pick.checked){ pick.checked=true; pick.dispatchEvent(new Event("change",{bubbles:true})); } }
      }
    });
  }
  /* 결제 페이지 주소와 상관없이 "결제 수단" 글자가 있는 페이지에서만 실행 */
  var k=0, t=setInterval(function(){
    if(/결제\s*수단/.test(document.body.innerText||"")) run();
    if(++k>=80) clearInterval(t);
  },250);
})();
</script>

  function prodCard(o){
    if(!o) return "";
    return '<div class="odg-prod">'+(o.img?'<img src="'+o.img+'" alt="">':'')+'<div><b>'+esc(o.name)+'</b><small>'+(o.qty?'수량 '+esc(o.qty)+' · ':'')+esc(o.date)+' 주문</small><span class="odg-st">'+esc(o.status)+'</span></div></div>';
  }
  function gateRender(state, o){
    if(!gate) return;
    var b = gate.querySelector(".odg-b"), h = "";
    curOrder = o || curOrder;
    if(state === "loading"){
      h = '<div class="odg-load"><span class="odg-spin"></span><p>'+(o && o.msg ? esc(o.msg) : '주문 내역을 확인하고 있어요')+'</p></div>';
    }else if(state === "none"){
      h = '<div class="odg-ic">'+GATE_ICON.heart+'</div><div class="odg-en">Direction Note</div>'+
          '<div class="odg-h">아직 리뷰를 남길 수 있는<br>주문이 없어요</div>'+
          '<div class="odg-d">상품을 구매하시면 주문 1건당 상품별로<br>한 번 리뷰를 남길 수 있어요.</div>'+
          '<div class="odg-warn">작성한 리뷰는 <b>삭제 후 다시 작성할 수 없어요.</b><br>신중하게 남겨 주세요.</div>'+
          '<div class="odg-btns"><button type="button" class="odg-p" data-odg-close>확인</button><a class="odg-t" href="/shop_mypage/?m2=order">마이페이지 주문조회</a></div>';
    }else if(state === "confirm"){
      h = '<div class="odg-en">Direction Note</div>'+
          '<div class="odg-h">구매확정 후<br>리뷰를 남길 수 있어요</div>'+
          '<div class="odg-d">피부에 어떤 방향으로 작용했는지<br>들려주세요.</div>'+prodCard(o)+
          '<div class="odg-warn"><b>구매확정 후에는 반품·교환 신청이 어려워요.</b><br>상품을 충분히 확인하신 뒤 확정해 주세요.</div>'+
          '<div class="odg-err"></div>'+
          '<div class="odg-btns">'+(o.oc
            ? '<button type="button" class="odg-p" data-odg-confirm>구매확정하고 리뷰 쓰기</button>'
            : '<a class="odg-p" href="/shop_mypage/?m2=order'+AMP+'od_confirm='+encodeURIComponent(o.no)+'">구매확정하고 리뷰 쓰기</a>')+
          '<button type="button" class="odg-s" data-odg-close>나중에 할게요</button></div>'+
          '<div class="odg-steps"><i class="on">구매확정</i><em>→</em><i>별점·평가</i><em>→</em><i>리뷰 등록</i></div>';
    }else if(state === "ship"){
      h = '<div class="odg-ic">'+GATE_ICON.truck+'</div><div class="odg-en">Direction Note</div>'+
          '<div class="odg-h">상품을 받으신 뒤<br>리뷰를 남길 수 있어요</div>'+
          '<div class="odg-d">배송이 완료되면 구매확정 후<br>바로 리뷰를 작성할 수 있어요.</div>'+prodCard(o)+
          '<div class="odg-btns"><button type="button" class="odg-p" data-odg-close>확인</button><a class="odg-t" href="/shop_mypage/?m2=order'+AMP+'idx='+encodeURIComponent(o.no)+AMP+'order_no='+encodeURIComponent(o.no)+'">배송 조회하기</a></div>';
    }
    b.innerHTML = h;
    b.parentNode.classList.toggle("is-load", state === "loading");
  }

  /* 내 주문 중 이 상품의 상태 확인 */
  function fetchOrders(){
    var m = /[?&]idx=(\d+)/.exec(location.search), idx = m ? m[1] : "";
    var body = "page=1"+String.fromCharCode(38)+"type=order"+String.fromCharCode(38)+"isMigration=N"+String.fromCharCode(38)+"summary_status="+String.fromCharCode(38)+"summary_months=";
    return fetch("/shop/oms/OMS_mypage_order_list.cm", { method:"POST", credentials:"include",
      headers:{ "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8", "X-Requested-With":"XMLHttpRequest" }, body: body })
    .then(function(r){ return r.json(); })
    .then(function(res){
      var out = [];
      if(!res || !res.html) return out;
      var doc = new DOMParser().parseFromString(res.html, "text/html");
      [].forEach.call(doc.querySelectorAll("tr.content"), function(tr){
        var link = tr.querySelector('a[href*="idx="]');
        var pm = link ? /[?&]idx=(\d+)/.exec(link.getAttribute("href")) : null;
        if(idx && pm && pm[1] !== idx) return;
        var table = tr.closest("table");
        var nl = table ? table.querySelector('a[href*="order_no="]') : null;
        var nm = nl ? /order_no=(\d+)/.exec(nl.getAttribute("href")) : null;
        var st = tr.querySelector(".section_info") || tr.querySelector(".text-default");
        var img = tr.querySelector("img");
        var qm = /(\d+)\s*개/.exec(tr.textContent || "");
        var dt = table ? table.querySelector(".im-xs-bold") : null;
        var nameEl = tr.querySelector("[data-2]");
        var cb = (table || tr).querySelector('[onclick*="C3_orderConfirm"]');
        var cm = cb ? /C3_orderConfirm\(\s*'([^']+)'\s*,\s*'([^']+)'/.exec(cb.getAttribute("onclick")) : null;
        out.push({
          oc: cm ? cm[1] : "",
          sc: cm ? cm[2] : "",
          no: nm ? nm[1] : "",
          status: (st ? st.textContent : "").replace(/\s+/g," ").trim(),
          img: img ? img.getAttribute("src") : "",
          qty: qm ? qm[1]+"개" : "",
          date: dt ? dt.textContent.trim() : "",
          name: nameEl ? nameEl.textContent.replace(/\s+/g," ").trim() : ""
        });
      });
      return out;
    })["catch"](function(){ return []; });
  }
  function decide(){
    if(!flow || !flow.listDone || !flow.orders) return;
    var os = flow.orders;
    var c = os.filter(function(o){ return /배송\s*완료/.test(o.status); })[0];
    var s = os.filter(function(o){ return /배송\s*중|배송\s*준비|상품\s*준비|결제\s*완료|입금|발송/.test(o.status); })[0];
    if(c) gateRender("confirm", c);
    else if(s) gateRender("ship", s);
    else gateRender("none");
    flow = null;
  }
  /* 상세페이지에서 바로 구매확정 (아임웹 마이페이지와 같은 방식) → 성공하면 바로 리뷰 작성 창 */
  function confirmAndReview(btn){
    var o = curOrder; if(!o || !o.oc) return;
    var err = gate ? gate.querySelector(".odg-err") : null;
    if(err){ err.textContent = ""; err.style.display = "none"; }
    btn.disabled = true; btn.textContent = "구매확정 중이에요";
    fetch("/ajax/oms/OMS_auth.cm", { credentials:"include" })
    .then(function(r){ return r.json(); })
    .then(function(auth){
      if(!auth || !/^success$/i.test(auth.message||"") || !auth.token) throw new Error((auth && auth.message) || "auth");
      return fetch("/ajax/oms/OMS_wrap_customer_v1_orders_{orderCode}_sections_purchase-confirmation.cm?orderCode="+encodeURIComponent(o.oc), {
        method:"PATCH", credentials:"include",
        headers:{ "Authorization":"Bearer "+auth.token, "Content-Type":"application/json", "Accept":"application/json" },
        body: JSON.stringify({ orderSectionCode: o.sc })
      });
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!(res && res.data && res.data.updateResult === true)) throw new Error((res && res.code) || "fail");
      /* 확정 완료 → 리뷰 작성 창 열기 */
      gateRender("loading", { msg:"구매확정 완료! 리뷰 작성 창을 여는 중이에요" });
      flow = { t: Date.now(), listDone:false, orders:[] };
      document.documentElement.classList.add("od-rv-skip");
      var f = flow;
      setTimeout(function(){
        try{ window.SITE_SHOP_DETAIL.openBuyerReview(prodCode); }
        catch(x){ location.href = "/shop_mypage/?m2=order"; }
      }, 300);
      setTimeout(function(){ if(flow === f){ flow = null; gateClose(); } }, 8000);
    })
    ["catch"](function(){
      btn.disabled = false; btn.textContent = "구매확정하고 리뷰 쓰기";
      if(err){
        err.innerHTML = '구매확정을 처리하지 못했어요. <a href="/shop_mypage/?m2=order">마이페이지 주문조회</a>에서 다시 시도해 주세요.';
        err.style.display = "block";
      }
    });
  }

  function closeImwebList(){
    var m = document.querySelector("#cocoaModal.modal_eduModal");
    if(!m) return;
    try{ if(window.jQuery) window.jQuery(m).modal("hide"); else m.style.display = "none"; }catch(e){ m.style.display = "none"; }
    var x = m.querySelector('[data-dismiss="modal"], .close'); if(x && m.offsetParent!==null) x.click();
  }

  document.addEventListener("click", function(e){
    var a = e.target.closest('[onclick*="openBuyerReview"]');
    if(!a) return;
    var pc = /openBuyerReview\(\s*'([^']+)'/.exec(a.getAttribute("onclick")||"");
    if(pc) prodCode = pc[1];
    flow = { t: Date.now(), listDone:false, orders:null };
    gateOpen();
    document.documentElement.classList.add("od-rv-skip");
    var f = flow;
    fetchOrders().then(function(os){ if(flow !== f) return; f.orders = os; decide(); });
    /* 아임웹 목록이 너무 늦으면 원래 창을 보여줌 */
    setTimeout(function(){ if(flow === f){ flow = null; gateClose(); } }, 8000);
  }, true);

  function watchList(){
    if(!flow || flow.listDone) return;
    var m = document.querySelector("#cocoaModal.modal_eduModal");
    /* 닫혀 있는(지난번) 창은 보지 않음: 새로 열린 창만 판단 */
    if(!m || getComputedStyle(m).display === "none") return;
    var body = m.querySelector(".modal-body");
    var txt = (body ? body.textContent : "").replace(/\s+/g,"");
    var links = m.querySelectorAll('[onclick*="openAddReview"]');
    if(links.length){
      flow = null; gateClose();
      links[0].click();
      return;
    }
    if(txt.length > 4){
      flow.listDone = true;
      closeImwebList();
      decide();
    }
  }

  /* 마이페이지 주문조회: ?od_confirm=주문번호 → 그 주문 구매확정 → 구매평 작성 창 자동 열기 */
  (function(){
    var q = /[?&]od_confirm=(\d+)/.exec(location.search);
    var no = q ? q[1] : "";
    try{
      if(no) sessionStorage.setItem("od_confirm", JSON.stringify({ no:no, t:Date.now() }));
      else{ var sv = JSON.parse(sessionStorage.getItem("od_confirm")||"null"); if(sv && Date.now()-sv.t < 10*60*1000) no = sv.no; }
    }catch(e){}
    if(!no || !/shop_mypage/.test(location.pathname)) return;
    var clickedConfirm = false, started = Date.now();
    function orderBox(){
      var l = document.querySelector('#shop_mypage_orderlist a[href*="order_no='+no+'"]');
      return l ? (l.closest("table") || l.closest("tbody")) : null;
    }
    function btnByText(box, re){
      return [].slice.call(box.querySelectorAll("a, button")).filter(function(b){ return re.test((b.textContent||"").replace(/\s+/g,"")) && b.offsetParent!==null; })[0];
    }
    var iv = setInterval(function(){
      var box = orderBox();
      if(Date.now()-started > 120000){ clearInterval(iv); try{ sessionStorage.removeItem("od_confirm"); }catch(e){} return; }
      if(!box) return;
      var rv = btnByText(box, /^(구매평|리뷰)작성$/);
      if(rv){
        clearInterval(iv);
        try{ sessionStorage.removeItem("od_confirm"); }catch(e){}
        box.scrollIntoView({ block:"center" });
        rv.click();
        return;
      }
      var cf = btnByText(box, /^구매확정$/);
      if(cf && !clickedConfirm){
        clickedConfirm = true;
        box.scrollIntoView({ block:"center" });
        cf.classList.add("odg-hl");
        cf.click();
      }
    }, 400);
  })();

  function tick(){
    watchList();
    [].forEach.call(document.querySelectorAll(".modal_add_review"), function(m){
      enhance(m);
      /* 구조가 달라 디자인을 못 입히면 1.5초 뒤 원래 창이라도 보이게 */
      var fm = m.querySelector("#review_form");
      if(fm && !fm.getAttribute("data-odw") && !fm.getAttribute("data-odw-t")){
        fm.setAttribute("data-odw-t","1");
        setTimeout(function(){ if(!fm.getAttribute("data-odw")) m.classList.add("odw-skip"); }, 1500);
      }
    });
  }
  var t=null;
  new MutationObserver(function(){
    /* 작성 창은 기다리지 않고 바로 처리 (원래 창이 깜빡이지 않게) */
    if(document.querySelector('.modal_add_review #review_form:not([data-odw])')) tick();
    if(t) return; t=setTimeout(function(){ t=null; tick(); }, 60);
  }).observe(document.body, { childList:true, subtree:true });
  tick();
})();
</script>

<script>
(function(){
  if(!/^\/shop_mypage/.test(location.pathname)) return;
  var html = document.documentElement;
  html.classList.add("od-my");
  /* 아임웹 기본 쿠폰 화면(m2=coupon_list)은 온디레브 쿠폰 화면으로 */
  if(/[?&]m2=coupon_list\b/.test(location.search)){ location.replace("/shop_mypage/?m2=coupon"); return; }
  var isCoupon = /[?&]m2=coupon\b/.test(location.search);
  if(isCoupon) html.classList.add("od-my-coupon");
  var AMP = String.fromCharCode(38);
  var CP_URL = "/shop_mypage/?m2=coupon";
  var KAKAO_CH = "https://pf.kakao.com/_lkcJX/friend";
  var couponCount = null;

  function esc(s){ return String(s).split(AMP).join(AMP+"amp;").split("<").join(AMP+"lt;").split(">").join(AMP+"gt;").split('"').join(AMP+"quot;"); }

  /* 페이지 바탕색 */
  function paintBg(){
    var sc = document.querySelector(".shop-content.mypage"); if(!sc || sc.getAttribute("data-odbg")) return;
    sc.setAttribute("data-odbg","1");
    for(var a = sc, i = 0; a && a !== document.body && i < 8; a = a.parentElement, i++){
      var bg = getComputedStyle(a).backgroundColor;
      if(/rgb\(\s*24[0-9],\s*24[0-9],\s*24[0-9]\s*\)/.test(bg)){ a.style.backgroundColor = "#F5F8FB"; }
    }
  }

  /* 메뉴: 쿠폰 추가 + 정리 */
  function menus(){
    /* PC 왼쪽 */
    [].forEach.call(document.querySelectorAll(".shop-content.mypage .left-menu.hidden-xs ul"), function(ul){
      if(ul.getAttribute("data-odm")) return;
      var pt = ul.querySelector('a[href*="m2=point_list"]'); if(!pt) return;
      ul.setAttribute("data-odm","1");
      /* 쿠폰이 있는 회원에게 아임웹이 따로 넣는 쿠폰 메뉴는 숨김 (온디레브 쿠폰 메뉴 하나만) */
      [].forEach.call(ul.querySelectorAll('a[href*="m2=coupon_list"]'), function(a){ var l = a.closest("li"); if(l) l.style.setProperty("display","none","important"); });
      if(!ul.parentNode.querySelector(".od-my-hd")){
        var hd = document.createElement("div"); hd.className = "od-my-hd";
        hd.innerHTML = '<span class="en">My Direction</span><b>마이페이지</b>';
        ul.parentNode.insertBefore(hd, ul);
      }
      if(!ul.querySelector(".od-cp-li")){
        var li = document.createElement("li"); li.className = "od-cp-li";
        li.innerHTML = '<a href="'+CP_URL+'" class="text-gray-dark _fade_link"><span>쿠폰</span><span class="od-cp-n" style="display:none"></span></a>';
        pt.closest("li").parentNode.insertBefore(li, pt.closest("li").nextSibling);
      }
      var subFirst = true;
      [].forEach.call(ul.querySelectorAll("li"), function(l){
        var a = l.querySelector("a");
        if(a && /editProfile|openGoodbye/.test(a.getAttribute("onclick")||"")){
          l.classList.add("od-my-sub"); if(subFirst){ l.classList.add("first"); subFirst = false; }
        }
      });
      if(isCoupon){
        [].forEach.call(ul.querySelectorAll("li.on"), function(l){ l.classList.remove("on"); });
        ul.querySelector(".od-cp-li").classList.add("on");
      }
    });
    /* 모바일 탭 */
    [].forEach.call(document.querySelectorAll("#cart_menu .cart-menu-slide"), function(box){
      if(box.getAttribute("data-odm")) return;
      var pt = box.querySelector('a[href*="m2=point_list"]'); if(!pt) return;
      box.setAttribute("data-odm","1");
      [].forEach.call(box.querySelectorAll('a[href*="m2=coupon_list"]'), function(a){ var l = a.closest("li"); if(l) l.style.setProperty("display","none","important"); });
      var li = document.createElement("li"); li.className = "od-cp-li";
      li.innerHTML = '<a href="'+CP_URL+'" class="body_font_color_50"><span>쿠폰</span></a>';
      pt.closest("li").parentNode.insertBefore(li, pt.closest("li").nextSibling);
      if(isCoupon){
        [].forEach.call(box.querySelectorAll("li.active"), function(l){ l.classList.remove("active"); });
        li.classList.add("active");
        setTimeout(function(){ try{ box.scrollLeft = li.offsetLeft - 60; }catch(e){} }, 50);
      }
    });
  }

  /* 프로필 카드: 쿠폰 수 추가 */
  function summary(){
    var as = document.querySelector("#mypage-summary .mypage-summary__assets");
    if(!as || as.querySelector(".od-cp-asset")) return;
    var native = document.querySelector("._mypage_use_coupon_count");
    if(native){ var n = parseInt((native.textContent||"").replace(/[^\d]/g,""),10); if(!isNaN(n)) couponCount = n; }
    /* 일반 회원: 카카오 가입 쿠폰을 뺀 장 수로 (쿠폰 화면이 아니어도) */
    if(couponCount && !isCoupon){
      var adjust = function(){
        if(window.OD_KK !== "normal") return;
        fetch("/shop/mypage_coupon_list.cm", { method:"POST", credentials:"include", headers:{ "X-Requested-With":"XMLHttpRequest" } })
        .then(function(r){ return r.json(); }).then(function(res){
          var d = new DOMParser().parseFromString((res && res.html) || "", "text/html");
          var k = [].filter.call(d.querySelectorAll(".sale-coupon-name-text"), function(e){ return KK_RE.test(e.textContent||""); }).length;
          if(k){ couponCount = Math.max(0, couponCount - k); paintCount(); }
        })["catch"](function(){});
      };
      if(window.OD_KK) adjust(); else window.addEventListener("od:kk", adjust, { once:true });
    }
    [].forEach.call(as.querySelectorAll('a[href*="m2=coupon_list"]'), function(a){ a.style.setProperty("display","none","important"); });
    var a = document.createElement("a");
    a.href = CP_URL; a.className = "mypage-summary__asset od-cp-asset";
    a.innerHTML = '<span class="mypage-summary__label">쿠폰</span><strong class="mypage-summary__value">'+(couponCount==null?0:couponCount)+'</strong>';
    var pt = as.querySelector('a[href*="point_list"]');
    if(pt && pt.nextSibling) as.insertBefore(a, pt.nextSibling); else as.appendChild(a);
    paintCount();
  }
  function paintCount(){
    var v = couponCount==null ? 0 : couponCount;
    [].forEach.call(document.querySelectorAll(".od-cp-asset .mypage-summary__value, .od-cp-top .t strong span"), function(el){ el.textContent = v.toLocaleString(); });
    [].forEach.call(document.querySelectorAll(".od-cp-n"), function(el){ el.textContent = v; el.style.display = v > 0 ? "" : "none"; });
  }

  /* 제목 옆 영문 라벨 + 주문 상태 배지 */
  function decorate(){
    [].forEach.call(document.querySelectorAll(".shop-content.mypage .im-body-size-140"), function(t){
      if(t.querySelector(".od-my-en")) return;
      var tx = (t.textContent||"").trim();
      var map = { "주문 조회":"Order", "위시 리스트":"Wish", "포인트":"Point", "재입고/오픈 알림":"Notify", "1:1 문의":"Q"+AMP+"A" };
      if(map[tx]){ var s = document.createElement("span"); s.className = "od-my-en"; s.textContent = map[tx]; t.appendChild(s); }
      if(isCoupon){ var row = t.closest(".tw-mb-\\[20px\\]") || t.parentElement; if(row) row.classList.add("od-my-hide"); }
    });
    [].forEach.call(document.querySelectorAll("#shop_mypage_orderlist .section_info > span, #shop_mypage_orderlist tr.content [data-3] > span.text-default"), function(sp){
      if(sp.classList.contains("od-st")) return;
      var t = (sp.textContent||"").trim(); if(!t) return;
      sp.classList.add("od-st");
      sp.classList.add(/구매확정/.test(t) ? "s-done" : /취소|반품|환불|교환완료/.test(t) ? "s-off" : "s-ship");
    });
  }

  /* 쿠폰 화면 */
  function couponPage(){
    if(!isCoupon || document.querySelector(".od-cp")) return;
    var host = document.querySelector("#shop_mypage_orderlist");
    var col = host ? host.parentElement : document.querySelector(".shop-content.mypage .col-md-10");
    if(!col) return;
    var w = document.createElement("div"); w.className = "od-cp";
    w.innerHTML =
      '<div class="od-cp-ttl">쿠폰<span class="od-my-en">Coupon</span></div>'+
      '<div class="od-cp-top"><div class="t"><b>보유 쿠폰</b><strong><span>0</span><em>장</em></strong></div>'+
        '<div class="od-cp-reg"><input type="text" placeholder="쿠폰 코드를 입력해 주세요" autocomplete="off"><button type="button" disabled>등록</button></div>'+
        '<div class="od-cp-msg"></div></div>'+
      '<div class="od-cp-list"></div>'+
      '<div class="od-bn"><div class="od-bn-en">Benefit</div><h5>받을 수 있는 혜택</h5><p>조건을 채우면 바로 받을 수 있어요.</p><div class="od-ms">'+
        '<div class="od-m" data-m="ch"><div class="ic kk"><svg viewBox="0 0 24 24"><path fill="#3C1E1E" d="M12 3C6.9 3 3 6.3 3 10.3c0 2.5 1.6 4.7 4.1 6l-.9 3.4c-.1.3.2.5.5.4l4-2.7c.4 0 .9.1 1.3.1 5.1 0 9-3.3 9-7.2S17.1 3 12 3z"/></svg></div>'+
          '<div class="tx"><b>카카오 채널 추가</b><small>온디레브 소식과 혜택을 먼저 받아보세요 · 1인 1회</small><span class="rw">2,000원 쿠폰</span></div>'+
          '<a class="bt k" href="'+KAKAO_CH+'" target="_blank" rel="noopener">채널 추가</a></div>'+
        '<div class="od-m" data-m="ph"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#4B86B4" stroke-width="1.6"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></div>'+
          '<div class="tx"><b>포토 리뷰 작성</b><small>피부 변화가 보이는 사진과 함께 · 구매한 제품마다</small><span class="rw">1,000P 적립</span></div>'+
          '<a class="bt" href="/shop_mypage/?m2=order">리뷰 쓰기</a></div>'+
      '</div></div>';
    col.insertBefore(w, host || null);
    paintCount();

    /* 코드 등록 */
    var inp = w.querySelector(".od-cp-reg input"), btn = w.querySelector(".od-cp-reg button"), msg = w.querySelector(".od-cp-msg");
    function sync(){ btn.disabled = !inp.value.trim(); }
    inp.addEventListener("input", sync);
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter" && !e.isComposing) btn.click(); });
    btn.addEventListener("click", function(){
      var code = inp.value.trim(); if(!code) return;
      btn.disabled = true; msg.className = "od-cp-msg";
      fetch("/shop/register_coupon_code.cm", { method:"POST", credentials:"include",
        headers:{ "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8", "X-Requested-With":"XMLHttpRequest" },
        body:"coupon_code="+encodeURIComponent(code) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.success){
          inp.value = "";
          if(typeof res.use_coupon_count === "number"){ couponCount = res.use_coupon_count; paintCount(); }
          msg.textContent = res.message || "쿠폰이 등록되었어요."; msg.className = "od-cp-msg ok";
          loadList();
        }else{
          if(res && res.need_login){ location.href = "/login"; return; }
          msg.textContent = (res && res.message) || "쿠폰을 등록하지 못했어요."; msg.className = "od-cp-msg no";
        }
        sync();
      })["catch"](function(){ msg.textContent = "잠시 후 다시 시도해 주세요."; msg.className = "od-cp-msg no"; sync(); });
    });
    loadList();
    /* 채널 추가: 이 브라우저에서 이미 눌렀거나, 채널 쿠폰을 갖고 있으면 숨김 */
    var chCard = w.querySelector('.od-m[data-m="ch"]');
    var chDone = false; try{ chDone = localStorage.getItem("od_channel") === "1"; }catch(e){}
    if(chDone && chCard) chCard.parentNode.removeChild(chCard);
    if(chCard && chCard.parentNode){
      chCard.querySelector(".bt").addEventListener("click", function(){
        try{ localStorage.setItem("od_channel","1"); }catch(e){}
        setTimeout(function(){ if(chCard.parentNode) chCard.parentNode.removeChild(chCard); }, 600);
      });
    }
  }

  /* 쿠폰 목록(아임웹) → 온디레브 쿠폰 카드 */
  function loadList(){
    var box = document.querySelector(".od-cp-list"); if(!box) return;
    fetch("/shop/mypage_coupon_list.cm", { method:"POST", credentials:"include", headers:{ "X-Requested-With":"XMLHttpRequest" } })
    .then(function(r){ return r.json(); })
    .then(function(res){
      var h = (res && res.msg === "SUCCESS") ? (res.html||"") : "";
      if(!h || /없습니다/.test(h.replace(/<[^>]+>/g,""))){
        box.innerHTML = '<div class="od-cp-empty"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B86B4" stroke-width="1.6"><path d="M3 8h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M14 8v10" stroke-dasharray="2 2"/></svg></div>'+
          '<p>아직 보유한 쿠폰이 없어요</p><small>쿠폰이 생기면 여기에서 확인할 수 있어요.</small></div>';
        return;
      }
      /* 아임웹 쿠폰 기능(사용안내·다운로드)이 그대로 동작하도록 아임웹 방식으로 불러옴 */
      box.innerHTML = '<div class="od-cp-src" id="couopn_list"><div class="_coupon_list">'+h+'</div></div><div class="od-cp-tks od-cp-mine" data-od-kc="1"></div>';
      try{ if(window.SITE_COUPON && typeof window.SITE_COUPON.init === "function") window.SITE_COUPON.init(); }catch(e){}
      tickets();
    })["catch"](function(){});
  }
  /* 아임웹 쿠폰 칸을 온디레브 쿠폰 카드로 바꿈 (버튼은 원래 것을 옮겨서 기능 유지) */
  var KK_RE = /카카오\s*회원가입\s*기념\s*쿠폰|^\s*회원가입\s*기념\s*쿠폰/;
  var baseCount = null;
  function tickets(){
    var src = document.querySelector(".od-cp-src"), mine = document.querySelector(".od-cp-mine");
    if(!src || !mine) return;
    /* 카카오 가입 쿠폰 판별이 끝날 때까지 대기 (일반 회원에게 잠깐 보이지 않게) */
    if(window.OD_KK === null) return;
    var hideKK = window.OD_KK === "normal", skipped = 0;
    if(baseCount === null) baseCount = couponCount;
    [].forEach.call(src.querySelectorAll(".mypage-coupon-wrap"), function(w){
      if(w.getAttribute("data-odt")) return;
      w.setAttribute("data-odt","1");
      var tt = w.querySelector(".discount-title"), nm = w.querySelector(".sale-coupon-name-text");
      var ds = w.querySelector(".coupon-desc"), dt = w.querySelector(".coupon-date");
      var title = tt ? tt.textContent.replace(/\s+/g," ").trim() : "";
      var m = /([\d,.]+)\s*(원|%)/.exec(title);
      var amt = m ? m[1] : title, unit = m ? (m[2] === "%" ? "% 할인" : "원 할인") : "";
      var name = nm ? (nm.firstChild && nm.firstChild.nodeType === 3 ? nm.firstChild.nodeValue : nm.textContent) : "";
      if(hideKK && KK_RE.test(name||"")){ w.setAttribute("data-kk","1"); return; }
      var t = document.createElement("div");
      t.className = "od-cp-tk od-cp-real"; t.setAttribute("data-od-kc","1");
      t.innerHTML = '<div class="l"><strong>'+esc(amt)+'</strong><small>'+esc(unit)+'</small></div>'+
        '<div class="r"><b>'+esc((name||"").trim())+'</b>'+
        (ds ? '<small>'+esc(ds.textContent.trim())+'</small>' : '')+
        (dt ? '<small class="dt">'+esc(dt.textContent.trim())+'</small>' : '')+
        '<div class="act"></div><span class="use">결제창에서 사용 가능</span></div>';
      var act = t.querySelector(".act");
      var info = w.querySelector("._coupon_use_btn, .coupon_use_btn");
      /* 같은 쿠폰 카드가 이미 있으면 새 것으로 교체 (아임웹이 목록을 다시 불러올 때 중복 방지) */
      var key = (info && info.getAttribute("data-code")) || (title+"|"+name);
      t.setAttribute("data-c", key);
      [].forEach.call(mine.querySelectorAll(".od-cp-real"), function(o){ if(o.getAttribute("data-c") === key) o.parentNode.removeChild(o); });
      /* 버튼은 원래 아임웹 버튼(숨김)을 대신 눌러줌 → 아임웹 사용안내·다운로드 기능 그대로 */
      if(info){ act.insertAdjacentHTML("beforeend", '<button type="button" class="od-cp-info" data-code="'+esc(info.getAttribute("data-code")||"")+'">사용안내</button>'); }
      var down = w.querySelector("._down_coupon_btn:not([disabled])");
      if(down){ act.insertAdjacentHTML("beforeend", '<button type="button" class="od-cp-get" data-code="'+esc(down.getAttribute("data-code")||"")+'">쿠폰 받기</button>'); }
      mine.appendChild(t);
    });
    if([].some.call(src.querySelectorAll(".sale-coupon-name-text"), function(e){ return /채널/.test(e.textContent||""); })){
      var cc = document.querySelector('.od-m[data-m="ch"]'); if(cc && cc.parentNode) cc.parentNode.removeChild(cc);
    }
    /* 일반 회원: 카카오 가입 쿠폰은 장 수에서도 제외 */
    if(hideKK){
      skipped = src.querySelectorAll('.mypage-coupon-wrap[data-kk]').length;
      if(baseCount !== null){ couponCount = Math.max(0, baseCount - skipped); paintCount(); }
      if(!mine.children.length && !document.querySelector(".od-cp-empty")){
        mine.insertAdjacentHTML("beforebegin", '<div class="od-cp-empty"><p>아직 보유한 쿠폰이 없어요</p><small>쿠폰이 생기면 여기에서 확인할 수 있어요.</small></div>');
      }
    }
  }
  window.addEventListener("od:kk", function(){ tickets(); });

  document.addEventListener("click", function(e){
    var b = e.target.closest(".od-cp-info, .od-cp-get"); if(!b) return;
    e.preventDefault();
    var code = b.getAttribute("data-code"), src = document.querySelector(".od-cp-src"); if(!src) return;
    var sel = b.classList.contains("od-cp-info") ? "._coupon_use_btn" : "._down_coupon_btn";
    var org = [].slice.call(src.querySelectorAll(sel)).filter(function(x){ return x.getAttribute("data-code") === code; })[0];
    if(!org) return;
    if(window.jQuery) window.jQuery(org).trigger("click"); else org.click();
  });

  function run(){
    paintBg(); menus(); summary(); decorate(); couponPage(); tickets();
    /* Head 코드가 숨겨둔 내용을 디자인 적용 후 보여줌 */
    if(document.querySelector(".shop-content.mypage")) html.classList.remove("od-my-wait");
  }
  var t = null;
  new MutationObserver(function(){ if(t) return; t = setTimeout(function(){ t = null; run(); }, 80); }).observe(document.documentElement, { childList:true, subtree:true });
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", run); else run();
})();
</script>

<!-- ============================================================
     카카오 가입 쿠폰(5,000원)은 카카오 회원만
     · 아임웹 설정으로 가입 방식별 발급이 안 돼서, 화면에서 막음
     · 판별: 아임웹 정보 수정 화면의 "카카오 연결" 상태 (카카오 연결 = 카카오 회원)
     · 일반 회원:  결제창 → 이 쿠폰 자동 적용 해제 + 쿠폰 목록에서 숨김
                   마이페이지 → 쿠폰 카드·장 수에서 제외
                   상세페이지 → "쿠폰받기" 칸·카카오 가입 버튼 숨김
     · 쿠폰 이름을 바꾸면 아래 OD_KK_NAME 도 같이 바꿀 것
     ============================================================ -->
<style>
  html.od-kk-wait .od-kk-sec{ visibility:hidden !important; }
  .od-kk-hide{ display:none !important; }
</style>
<script>
(function(){
  var OD_KK_NAME = /카카오\s*회원가입\s*기념\s*쿠폰|^\s*회원가입\s*기념\s*쿠폰/;
  var path = location.pathname;
  var onPay = /^\/shop_payment/.test(path);
  var onMy = /^\/shop_mypage/.test(path);
  var onProd = (/[?&]idx=\d+/.test(location.search) && document.body.classList.contains("shop_view")) && !onPay && !onMy;
  if(!onPay && !onMy && !onProd) return;

  var html = document.documentElement;
  if(onPay) html.classList.add("od-kk-wait");
  window.OD_KK = null;   /* "kakao" | "normal" | "guest" */

  fetch("/dialog/join.cm", { method:"POST", credentials:"include",
    headers:{ "Content-Type":"application/x-www-form-urlencoded; charset=UTF-8", "X-Requested-With":"XMLHttpRequest" }, body:"back_url=" })
  .then(function(r){ return r.text(); })
  .then(function(h){
    var d = new DOMParser().parseFromString(h, "text/html");
    if(!d.querySelector('input[name="mode"][value="edit"]')){ window.OD_KK = "guest"; return; }
    var disc = d.querySelector("._kakao_sync_disconnect");
    window.OD_KK = (disc && !/display\s*:\s*none/i.test(disc.getAttribute("style")||"")) ? "kakao" : "normal";
  })["catch"](function(){ window.OD_KK = "normal"; })
  .then(function(){
    html.classList.remove("od-kk-wait");
    try{ window.dispatchEvent(new CustomEvent("od:kk", { detail: window.OD_KK })); }catch(e){}
    run();
  });
  setTimeout(function(){ html.classList.remove("od-kk-wait"); }, 3000);

  function txt(el){ return (el && el.textContent || "").replace(/\s+/g," ").trim(); }

  /* ---------- 결제창 ---------- */
  var removed = 0;
  function pay(){
    var head = [].slice.call(document.querySelectorAll("header")).filter(function(x){ return txt(x) === "쿠폰"; })[0];
    if(!head) return;
    var sec = head.parentElement && head.parentElement.parentElement;
    if(sec) sec.classList.add("od-kk-sec");
    if(window.OD_KK !== "normal" || !sec) return;
    /* 자동 적용된 카카오 쿠폰 해제 */
    if(OD_KK_NAME.test(txt(sec))){
      var cb = sec.querySelector('input[type="checkbox"]');
      if(cb && cb.checked){ removed = Math.max(removed, 1); cb.click(); }
    }
    /* "사용 가능 N장" 에서 숨긴 쿠폰 수만큼 빼기 */
    [].forEach.call(sec.querySelectorAll("button span"), function(sp){
      var m = /사용\s*가능\s*(\d+)\s*장/.exec(txt(sp)); if(!m || !removed || sp.getAttribute("data-kk")) return;
      var n = Math.max(0, +m[1] - removed);
      sp.setAttribute("data-kk","1");
      sp.textContent = n > 0 ? "사용 가능 "+n+"장" : "사용 가능한 쿠폰 없음";
      /* 쓸 수 있는 쿠폰이 없으면 "최대 할인 적용" 스위치 줄도 숨김 */
      if(n === 0){
        [].forEach.call(sec.querySelectorAll("div"), function(el){
          if(el.children.length === 0 && /최대\s*할인/.test(txt(el))){ var row = el.parentElement; if(row && row.querySelector('input[type="checkbox"]')) row.classList.add("od-kk-hide"); }
        });
      }
    });
    /* 쿠폰 선택 목록에서 카카오 쿠폰 숨김 */
    [].forEach.call(document.querySelectorAll('input[type="radio"][name*="coupon"]'), function(r){
      var li = r.closest("li"); if(!li || li.classList.contains("od-kk-hide")) return;
      if(OD_KK_NAME.test(txt(li))){ li.classList.add("od-kk-hide"); if(r.checked) r.checked = false; removed = Math.max(removed, 1); }
    });
  }

  /* ---------- 상세페이지 ---------- */
  function prod(){
    if(window.OD_KK !== "normal" && window.OD_KK !== "kakao") return;
    if(window.OD_KK === "normal"){
      [].forEach.call(document.querySelectorAll(".prod-detail-coupon-container"), function(c){
        if(OD_KK_NAME.test(txt(c))){ var w = c.closest(".prod-detail-coupon-container-style-a") || c; w.classList.add("od-kk-hide"); }
      });
    }
    /* 이미 회원인 사람에게는 "카카오 1초 가입" 버튼이 필요 없음 */
    [].forEach.call(document.querySelectorAll(".od-kcoupon:not(.is-channel)"), function(a){ a.classList.add("od-kk-hide"); });
  }

  function run(){ try{ if(onPay) pay(); if(onProd) prod(); }catch(e){} }
  var t = null;
  new MutationObserver(function(){ if(t) return; t = setTimeout(function(){ t = null; run(); }, 80); }).observe(document.documentElement, { childList:true, subtree:true });
})();
</script>
<!-- ===================== /카카오 가입 쿠폰 ===================== -->

<!-- ===================== 상세페이지 중복 리뷰 블록 정리 =====================
     · 구매 버튼 아래 "포토 리뷰 (N)" 슬라이더 숨김
     · 탭 아래 기본 평점(별점 + 빨간 막대그래프) 숨김
     · 그 아래 "포토 리뷰 (N)" 사진 줄 숨김
     · PC: 숨긴 뒤 남는 빈 회색 상자 숨김
     · 탭, Customer Review 요약, 리뷰 목록은 그대로
     ============================================================ -->
<script>
(function(){
  if(!(/[?&]idx=\d+/.test(location.search) && document.body.classList.contains("shop_view"))) return;   /* 상품 상세에서만 */

  var SKIP = "[data-od-dup], .odrs, .odtab, .odw, #cocoaModal, .list_review_inner";
  function hide(el){
    if(!el || el.hasAttribute("data-od-dup")) return;
    el.setAttribute("data-od-dup","1");
    el.style.setProperty("display","none","important");
  }
  /* 화면에 실제로 보이는 글자만 (숨겨진 버튼 글자는 빼고) */
  function vt(el){ return ((el && el.innerText) || "").replace(/\s+/g," ").trim(); }
  function vis(el){ var r=el.getBoundingClientRect(); return r.width>0 && r.height>0; }
  /* 여기까지 넓어지면 멈춤: 탭·우리 요약·리뷰 목록·구매 영역·다른 섹션 */
  function stop(el){
    if(!el || el===document.body || el===document.documentElement) return true;
    if(el.matches(".odrs, .odtab") || el.querySelector(".odrs, .odtab, .list_review_inner")) return true;
    var t=vt(el);
    if(/구매하기|장바구니|상세\s*정보|Customer Review|포토\s*(리뷰|구매평)만\s*보기|실제\s*구매\s*고객/.test(t)) return true;
    if((t.match(/포토\s*(리뷰|구매평)\s*\(\s*\d+\s*\)/g)||[]).length>1) return true;
    return false;
  }
  function hasPhoto(el){
    if([].some.call(el.querySelectorAll("img"),function(i){ return i.getBoundingClientRect().width>=40; })) return true;
    return [].some.call(el.querySelectorAll("div, span, a, li"),function(x){
      var r=x.getBoundingClientRect(); if(r.width<40 || r.height<40) return false;
      return /url\(/.test(x.style.backgroundImage||"") || /url\(/.test(getComputedStyle(x).backgroundImage);
    });
  }
  function textHits(re){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT), n, out=[];
    while((n=w.nextNode())){
      var p=n.parentElement;
      if(p && re.test(n.nodeValue) && !p.closest(SKIP) && vis(p)) out.push(p);
    }
    return out;
  }

  /* 1) "포토 리뷰 (N)" 블록 (위쪽 슬라이더 + 아래쪽 사진 줄) */
  function photoBlocks(){
    textHits(/포토\s*(리뷰|구매평)(?!\s*만)/).forEach(function(p){
      /* 제목: "포토 리뷰" + "(4)"가 나뉘어 있어도 한 줄로 묶어서 확인 */
      var h=p;
      for(var i=0;i<3 && h && !/^포토\s*(리뷰|구매평)\s*\(\s*\d+\s*\)/.test(vt(h));i++) h=h.parentElement;
      if(!h || vt(h).length>40 || !/^포토\s*(리뷰|구매평)\s*\(\s*\d+\s*\)/.test(vt(h))) return;
      if(h.closest(SKIP)) return;
      var last=null;
      for(var a=h; a && !stop(a); a=a.parentElement){
        if(a!==h && (hasPhoto(a) || a.getBoundingClientRect().height>150)){ hide(a); return; }
        last=a;
      }
      /* 제목 줄과 사진 칸이 나란히 놓인 경우: 제목 줄 + 바로 뒤 사진 칸 숨김 */
      if(!last) return;
      var sib=last.nextElementSibling, k=0;
      hide(last);
      while(sib && k<3){
        var nx=sib.nextElementSibling;
        if(stop(sib)) break;
        hide(sib); k++;
        if(hasPhoto(sib) || sib.getBoundingClientRect().height>150) break;
        sib=nx;
      }
    });
  }

  /* 2) 기본 평점 (5.0 · 총 N개의 리뷰 · 5점~1점 막대) */
  function nativeScore(){
    textHits(/총\s*[\d,]+\s*개의\s*(리뷰|구매평)/).forEach(function(p){
      for(var a=p, d=0; a && d<8 && !stop(a); a=a.parentElement, d++){
        var t=vt(a);
        if(/5\s*점/.test(t) && /1\s*점/.test(t)){ hide(a); return; }
      }
    });
  }

  /* 3) PC: 숨긴 뒤 남은 빈 상자(회색 배경) 정리 */
  function emptyBox(el){
    if(!el || stop(el)) return false;
    if(vt(el)) return false;
    return ![].some.call(el.querySelectorAll("img, iframe, video"),function(x){ return vis(x); });
  }
  function collapse(){
    [].forEach.call(document.querySelectorAll("[data-od-dup]"),function(el){
      for(var p=el.parentElement, d=0; p && d<4 && emptyBox(p); p=p.parentElement, d++) hide(p);
    });
    var bar=document.querySelector(".odtab"), rv=document.querySelector(".odrs");
    if(!bar || !rv) return;
    [].forEach.call(document.querySelectorAll("div, section"),function(el){
      if(el.hasAttribute("data-od-dup") || el.contains(rv) || el.contains(bar) || bar.contains(el)) return;
      if(!(bar.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING)) return;
      if(!(el.compareDocumentPosition(rv) & Node.DOCUMENT_POSITION_FOLLOWING)) return;
      var r=el.getBoundingClientRect(); if(r.height<20 || r.width<200) return;
      var cs=getComputedStyle(el);
      if(/rgba\(0, 0, 0, 0\)|transparent/.test(cs.backgroundColor) && !/url\(/.test(cs.backgroundImage)) return;
      if(emptyBox(el)) hide(el);
    });
  }

  function run(){
    try{ photoBlocks(); }catch(e){}
    try{ nativeScore(); }catch(e){}
    try{ collapse(); }catch(e){}
  }
  var t=null;
  new MutationObserver(function(){ if(t) return; t=setTimeout(function(){ t=null; run(); },120); }).observe(document.documentElement,{childList:true, subtree:true});
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", run); else run();
  window.addEventListener("load", run);
  var c=0, iv=setInterval(function(){ run(); if(++c>=10) clearInterval(iv); }, 500);   /* 늦게 그려지는 경우 대비 5초간 */
})();
</script>
