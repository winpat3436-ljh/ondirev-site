          var t = hit.querySelector('.discount-title'), ds = hit.querySelector('.coupon-desc');

      '.od-welcome-x{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;background:none;cursor:pointer}' +
      '.od-welcome-x:before,.od-welcome-x:after{content:"";position:absolute;left:17px;top:9px;width:1.6px;height:18px;background:#6E8299;transform:rotate(45deg)}' +

      '.od-welcome-en{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12px;color:#4B86B4;margin-bottom:6px}' +

    document.head.appendChild(st);

<script>
(function(){
  function els(){ return Array.prototype.slice.call(document.querySelectorAll('[class~="od-up" i]')); }

  function visible(el){
    var r = el.getBoundingClientRect();
    var W = window.innerWidth, H = window.innerHeight;
    if (r.width === 0 || r.height === 0) return false;
    if (r.right <= 0 || r.left >= W || r.bottom <= 0 || r.top >= H) return false;
    var cx = (r.left + r.right) / 2;
    if (cx < 0 || cx > W) return false;
    /* 자기 자신은 제외하고 '부모'부터 검사 (자기 자신은 등장 전 투명이 정상) */
    var p = el.parentElement, n = 0;
    while (p && p !== document.body && n++ < 8){
      var cs = getComputedStyle(p);
      if (cs.opacity === "0" || cs.visibility === "hidden" || cs.display === "none") return false;
      p = p.parentElement;
    }
    return true;
  }

  function tick(){
    els().forEach(function(el){
      var shown = /\bod-in\b/i.test(el.className);
      var vis = visible(el);
      if (vis && !shown)  el.className += " od-in";
      if (!vis && shown)  el.className = el.className.replace(/\bod-in\b/gi,"").replace(/\s+/g," ").trim();
    });
  }

  function start(){ tick(); setInterval(tick, 150); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>

 <script>
(function(){

  function on(a){ a.style.setProperty('background','#ffffff','important'); a.style.setProperty('color','#111111','important'); a.style.setProperty('border-color','#111111','important'); }
  function off(a){ a.style.setProperty('background','#1E2A3A','important'); a.style.setProperty('color','#ffffff','important'); a.style.setProperty('border-color','#1E2A3A','important'); }
  function bind(){
    pick().forEach(function(a){
      if(a.dataset.odHover) return; a.dataset.odHover='1';
      a.style.setProperty('-webkit-tap-highlight-color','transparent','important');
      a.addEventListener('mouseenter',function(){on(a)});
      a.addEventListener('mouseleave',function(){off(a)});
      a.addEventListener('touchstart',function(){on(a)},{passive:true});
      a.addEventListener('touchend',function(){setTimeout(function(){off(a)},150)},{passive:true});
      a.addEventListener('touchcancel',function(){off(a)},{passive:true});
    });
  }
  bind(); setInterval(bind, 500);
})();
</script>

<script>
(function(){
  function isYellow(el){ var bg=getComputedStyle(el).backgroundColor.replace(/\s/g,''); return /rgb\(25[0-5],2[23]\d,0\)|rgb\(254,229,0\)|rgb\(255,235,0\)/.test(bg); }
  function findKakao(){
    var c=document.querySelectorAll('a,button,div,span,label');
    for(var i=0;i<c.length;i++){
      var el=c[i], t=(el.textContent||'').replace(/\s/g,'');
      if(!/^카카오(로|톡으로|계정으로)?(시작|로그인|계속)/.test(t)) continue;
      var btn=el.closest('a,button')||el;
      var p=btn, n=0; while(p && n++<4){ if(isYellow(p) && p.offsetWidth>120) return p; p=p.parentElement; }
      if(btn.offsetWidth>120) return btn;
    }
    return null;
  }
  function place(){
    if(document.querySelector('.od-kakao-tip')) return true;
    var btn=findKakao(); if(!btn) return false;
    btn.classList.add('od-kakao-wrap');
    var tip=document.createElement('span'); tip.className='od-kakao-tip'; tip.textContent='플친 쿠폰 지급';
    btn.appendChild(tip); return true;
  }
  var n=0, t=setInterval(function(){ if(place()||++n>60) clearInterval(t); },250);
})();
</script>
