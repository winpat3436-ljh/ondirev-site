<script>
/* 수량 맞추기 공용 함수: 처음 값과의 차이만큼만 +/− 를 정확히 누른다.
   (누를 때마다 값을 다시 읽으면 아임웹 화면 갱신이 늦어 과하게 눌려 23개가 되던 문제 방지)
   같은 칸에 새 요청이 오면 이전 요청은 멈춘다. 끝난 뒤 값이 다르면 숫자를 직접 넣어 맞춘다. */
/* 공용: 비회원인지, 로그인 주소 */
window.__odIsGuest = function(){
  if(document.querySelector(".member-info.guest")) return true;
  if(document.body && document.body.classList.contains("member_login")) return false;
  if(document.querySelector(".profile-area .member-info")) return false;
  var vis=function(e){ return e && e.offsetParent!==null; };
  var login=[].some.call(document.querySelectorAll('a[href*="/login"]'), vis), logout=[].some.call(document.querySelectorAll('a[href*="logout"]'), vis);
  return !(logout && !login);
};
window.__odLoginHref = function(){ try{ return "/login?back_url=" + encodeURIComponent(btoa(location.pathname + location.search)) + "&used_login_btn=Y"; }catch(e){ return "/login"; } };
window.__odSetQty = function(inp, n, minus, plus){
  if(!inp) return;
  var job = (inp.__odJob = (inp.__odJob||0) + 1);
  var start = parseInt(inp.value,10) || 1, diff = n - start, btn = diff > 0 ? plus : minus, k = Math.abs(diff), i = 0;
  function fire(el, type){ try{ el.dispatchEvent(new Event(type, {bubbles:true})); }catch(e){} }
  function verify(){
    if(inp.__odJob !== job) return;
    if((parseInt(inp.value,10)||1) !== n){ inp.value = n; fire(inp,"input"); fire(inp,"change"); fire(inp,"keyup"); fire(inp,"blur"); }
  }
  if(!k){ verify(); return; }
  if(!btn){ verify(); return; }
  (function click(){
    if(inp.__odJob !== job) return;
    if(i++ >= k){ setTimeout(verify, 300); return; }
    btn.click(); setTimeout(click, 120);
  })();
};
</script>

<script>
/* 비로그인 상태일 때 profile-area 안에 로그인/회원가입 버튼 삽입 */
(function () {
  function injectClose() {
    var area = document.querySelector('.mobile_slide_menu_container .profile-area');
    if (!area || area.querySelector('.od-close')) return;
    var orig = document.querySelector('.mobile_slide_menu_container .navbar-toggle.slide-close');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'od-close';
    btn.setAttribute('aria-label', '메뉴 닫기');
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (orig) { orig.click(); return; }
      if (window.MOBILE_SLIDE_MENU && MOBILE_SLIDE_MENU.slideNavToggle) {
        MOBILE_SLIDE_MENU.slideNavToggle();
      }
    });
    area.appendChild(btn);
  }

  function bindToggles() {
    var items = document.querySelectorAll('.mobile_slide_menu_container .viewport-nav.mobile li.depth-01');
    for (var i = 0; i < items.length; i++) {
      var li = items[i];
      if (li.getAttribute('data-od-bound')) continue;
      var sub = li.querySelector(':scope > ul');
      var link = li.querySelector(':scope > a');
      if (!sub || !link) continue;
      li.setAttribute('data-od-bound', '1');
      li.classList.add('od-has-sub');
      link.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var parent = this.parentNode;
        var opening = !parent.classList.contains('od-open');
        /* 다른 열린 메뉴는 닫음 */
        var opened = document.querySelectorAll('.viewport-nav.mobile li.depth-01.od-open');
        for (var j = 0; j < opened.length; j++) opened[j].classList.remove('od-open');
        if (opening) parent.classList.add('od-open');
      }, true);
    }
  }

  function inject() {
    injectClose();
    bindToggles();
    var area = document.querySelector('.mobile_slide_menu_container .profile-area');
    if (!area || area.querySelector('.od-auth')) return;
    var guest = area.querySelector('.member-info.guest');
    if (!guest) return; /* 로그인 상태면 아무것도 안 함 */
    area.classList.add('od-guest');
    var url = '/login?back_url=Lw%3D%3D&used_login_btn=Y';
    var wrap = document.createElement('div');
    wrap.className = 'od-auth';
    wrap.innerHTML =
      '<a class="od-login" href="' + url + '">로그인</a>' +
      '<a class="od-join" href="' + url + '">회원가입</a>';
    area.appendChild(wrap);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inject);
  } else {
    inject();
  }
  /* 아임웹이 메뉴를 늦게 그리는 경우 대비 */
  setTimeout(inject, 800);
  setTimeout(inject, 2000);
})();
</script>

<div class="ond-bubble" id="ondBubble">카카오 가입 시 5,000원 쿠폰</div>

<script>
(function(){
  var b=document.getElementById('ondBubble'); if(!b) return;
  function isMember(){ return document.body.classList.contains('member_login') || !!document.querySelector('.profile-area .member-info:not(.guest)'); }
  /* 헤더 오른쪽의 로그인/마이페이지 아이콘 (상단 띠 안의 링크는 제외) */
  function findIcon(){
    var list=[].slice.call(document.querySelectorAll('.login_btn_item a, header a[href*="login"], header a[href*="mypage"], #doz_header a[href*="login"], #doz_header a[href*="mypage"]'))
      .filter(function(a){ if(a.closest('._text_table')) return false; var r=a.getBoundingClientRect(); return r.width>0 && r.height>0 && r.width<80; });
    list.sort(function(x,y){ return y.getBoundingClientRect().left - x.getBoundingClientRect().left; });
    return list[0]||null;
  }
  /* 상단 띠(가입 쿠폰 띠)의 아래 끝 — 말풍선이 띠를 덮지 않게 */
  function bannerBottom(){
    var bt=0;
    [].forEach.call(document.querySelectorAll('._text_table'),function(t){ var r=t.getBoundingClientRect(); if(r.height>0 && r.top<60 && r.bottom>bt) bt=r.bottom; });
    return bt;
  }
  function hide(){ b.style.display='none'; }
  function place(){
    if(window.innerWidth<=768 || isMember()) return hide();
    var icon=findIcon(); if(!icon) return hide();
    var r=icon.getBoundingClientRect();
    if(r.bottom<0 || r.top>window.innerHeight) return hide();
    b.style.display='block';
    var w=b.offsetWidth, h=b.offsetHeight, cx=r.left+r.width/2;
    var left=Math.max(8, Math.min(cx - w/2, window.innerWidth - w - 8));
    var top=r.top - h - 9;                                  /* 아이콘 바로 위, 화살표 포함 간격 */
    var minTop=bannerBottom()+4; if(top<minTop) top=minTop;  /* 상단 띠와 안 겹치게 */
    if(top+h+5>r.top){ return hide(); }                     /* 아이콘 위 공간이 없으면(헤더가 줄어든 경우) 숨김 */
    b.style.left=left+'px'; b.style.top=top+'px';
    b.style.setProperty('--ond-ax', Math.max(10, Math.min(cx-left, w-10))+'px');  /* 화살표는 아이콘 가운데를 가리킴 */
  }
  var last='';
  function loop(){
    var icon=findIcon(), key=window.innerWidth+','+(icon?(function(r){return r.left+','+r.top;})(icon.getBoundingClientRect()):'x')+','+bannerBottom();
    if(key!==last){ last=key; place(); }
    requestAnimationFrame(loop);
  }
  place(); requestAnimationFrame(loop);
  window.addEventListener('resize',place);
  b.addEventListener('click',function(){ var icon=findIcon(); if(icon) location.href=icon.href; });
})();
</script>

<script>
/* ============================================================
   가입 쿠폰은 카카오로 가입·로그인한 회원에게만 보여준다
   - 카카오 로그인에서 돌아온 브라우저에 표시(od_kakao=1)를 남긴다
   - 비회원: 쿠폰 칸 → "카카오톡 1초 가입 후 5,000원 쿠폰 받기" 버튼
   - 일반 가입 회원: 쿠폰 칸 숨김 (쿠폰받기 버튼 자체가 안 보임)
   - 카카오 회원: 아임웹 쿠폰 칸 그대로 (쿠폰받기 가능)
   ============================================================ */
(function(){
  var FIND = "회원가입 기념 쿠폰";   // 아임웹 쿠폰 칸에 적힌 문구 (쿠폰 이름을 바꾸면 여기도 같이)
  var KEY = "od_kakao";

  /* 1) 카카오 로그인에서 돌아왔는지 확인 → 표시 남기기 */
  (function mark(){
    var href = "", ref = document.referrer || "";
    try{ href = decodeURIComponent(decodeURIComponent(location.href)); }catch(e){ href = location.href; }
    if(/kakao_sync|kakao_login|oauth[^\s]*kakao/i.test(href) || /(kauth|accounts)\.kakao\.com/i.test(ref)){
      try{ localStorage.setItem(KEY, "1"); }catch(e){}
    }
  })();
  function isKakao(){ try{ return localStorage.getItem(KEY) === "1"; }catch(e){ return false; } }
  function isGuest(){
    if(document.querySelector(".member-info.guest")) return true;
    if(document.body.classList.contains("member_login")) return false;
    if(document.querySelector(".profile-area .member-info")) return false;
    return true;   // 판단이 안 되면 비회원으로 본다
  }
  function loginHref(){
    try{ return "/login?back_url=" + encodeURIComponent(btoa(location.pathname + location.search)) + "&used_login_btn=Y"; }
    catch(e){ return "/login"; }
  }
  function makeBtn(){

<script>

            /* 가운데 남색 원과 글자를 그림 안에 그려서, 테마 글꼴·크기와 상관없이 항상 원 안에 맞게 */

            '<text x="60" y="63" text-anchor="middle" fill="#fff" font-size="19" font-weight="800" textLength="58" lengthAdjust="spacingAndGlyphs" style="font-family:Pretendard,\'Apple SD Gothic Neo\',sans-serif">+7,000</text>' +
            '<text x="60" y="78" text-anchor="middle" fill="#fff" fill-opacity=".85" font-size="9.5" font-weight="500" textLength="44" lengthAdjust="spacingAndGlyphs" style="font-family:Pretendard,\'Apple SD Gothic Neo\',sans-serif">COUPON</text>' +

    function show(el, on){

      if(on){ var v = el.getAttribute("data-od-disp").split("|"); if(v[0]) el.style.setProperty("display", v[0], v[1]); else el.style.removeProperty("display"); }

  /* 아임웹 기본 "플친 쿠폰 지급" 말풍선 숨김 */
  function hideBubble(){
    var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), n;
    while((n = walker.nextNode())){

        while(el.parentElement && el.parentElement.textContent.replace(/\s+/g,"").length <= 12) el = el.parentElement;

    setTimeout(function(){ mo.disconnect(); }, 15000);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

<style>
  .od-qty{ display:grid; gap:10px; margin:18px 0; padding:14px; border-radius:14px; background:#F3F6FA;
    font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:#1E2A3A; word-break:keep-all; }
  .od-qty *{ box-sizing:border-box; }
  .od-qty-card{ position:relative; display:flex; align-items:center; justify-content:space-between; gap:12px;
    width:100%; padding:18px 18px; background:#fff; border:1px solid rgba(30,42,58,.12); border-radius:12px;
    text-align:left; cursor:pointer; font:inherit; color:inherit; transition:border-color .2s, box-shadow .2s; }
  .od-qty-card:hover{ border-color:rgba(27,58,92,.45); }
  .od-qty-card.is-on{ border-color:#1b3a5c; box-shadow:0 0 0 1px #1b3a5c inset; }
  .od-qty-flag{ position:absolute; top:-1px; left:16px; padding:4px 9px; border-radius:0 0 6px 6px; background:#1b3a5c; color:#fff; font-size:11px; font-weight:700; letter-spacing:.08em; }
  .od-qty-l{ min-width:0; }
  .od-qty-sub{ font-size:13px; color:#6E8299; margin-bottom:4px; }
  .od-qty-name{ font-size:16px; font-weight:700; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .od-qty-tag{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:#E6EEF6; color:#1b3a5c; }
  .od-qty-r{ flex:none; text-align:right; }
  .od-qty-off{ display:inline-block; padding:3px 9px; border-radius:999px; background:#1b3a5c; color:#fff; font-size:12px; font-weight:700; margin-bottom:6px; }
  .od-qty-unit{ font-size:16px; font-weight:800; white-space:nowrap; }
  .od-qty-unit small{ font-size:12px; font-weight:500; color:#6E8299; margin-left:2px; }
  .od-qty-total{ font-size:12px; color:#6E8299; margin-top:2px; white-space:nowrap; }
  .od-qty-card.has-flag{ padding-top:28px; }
  .od-qty-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 4px 2px; font-size:13px; font-weight:700; color:#1b3a5c; }
  .od-qty-head small{ font-size:11.5px; font-weight:500; color:#6E8299; }
  .od-qty-head small a{ color:#1b3a5c !important; text-decoration:underline !important; font-weight:600; }
  /* "카카오 1초 가입 후 적용" 전체가 로그인 버튼 */
  .od-qty-head a.od-qty-login{ flex:none; font-size:11.5px; font-weight:500; color:#6E8299 !important; -webkit-text-fill-color:#6E8299 !important; text-decoration:none !important; cursor:pointer; }
  .od-qty-head a.od-qty-login u{ color:#1b3a5c; -webkit-text-fill-color:#1b3a5c; text-decoration:underline; font-weight:600; }
  @media (max-width:420px){ .od-qty{ padding:10px; } .od-qty-card{ padding:16px 14px; } .od-qty-card.has-flag{ padding-top:26px; } .od-qty-name{ font-size:15px; } }
</style>
<script>
(function(){
  /* ===== 설정 (상품 번호별) =====
     base: 판매가, member: 회원가, rate: 수량별 추가 할인율(아임웹 '수량별 혜택'과 같게), free: 무료배송 기준 금액 */
  var PRODUCTS = {
    "1": { base:32000, member:26800, free:50000,
      tiers:[
        { n:1, sub:"처음 써보는 분께",   name:"단품 1개",  rate:0  },
        { n:2, sub:"나눠 쓰기 좋은",      name:"2개 세트",  rate:5,  flag:"BEST" },
        { n:3, sub:"가장 큰 혜택",        name:"3개 세트",  rate:10, flag:"최대할인" }
      ] }
  };
  var m = location.search.match(/[?&]idx=(\d+)/); if(!m || !PRODUCTS[m[1]]) return;
  var P = PRODUCTS[m[1]];
  var won = function(v){ return v.toLocaleString("ko-KR") + "원"; };

  function qtyInput(){
    var ins = document.querySelectorAll('input[type="text"], input[type="number"], input:not([type])');
    for(var i=0;i<ins.length;i++){ var el=ins[i]; if(el.offsetParent===null) continue; if(/^\d+$/.test(el.value) && el.closest("div") && /수량/.test((el.closest("div").parentElement||{}).textContent||"")) return el; }
    for(var j=0;j<ins.length;j++){ if(ins[j].offsetParent!==null && /^\d+$/.test(ins[j].value) && ins[j].value.length<4) return ins[j]; }
    return null;
  }
  /* 아임웹 수량 +/− 버튼을 눌러서 원하는 수량으로 맞춘다 */
  function setQty(n){
    var inp = qtyInput(); if(!inp) return;
    var box = inp.parentElement, btns = box ? box.querySelectorAll("button,a,span[class*='plus'],span[class*='minus']") : [];
    window.__odSetQty(inp, n, btns[0], btns[btns.length-1]);
  }

  function hasNativeInPageBuy(){
    var els=document.querySelectorAll("a,button");
    for(var i=0;i<els.length;i++){ var e=els[i]; if(e.closest(".od-buybar,.od-mbuy")) continue;
      var t=(e.textContent||"").replace(/\s+/g,""); if(!/^(구매하기|바로구매)$/.test(t) || e.offsetParent===null) continue;
      var fx=false; for(var a=e;a&&a!==document.body;a=a.parentElement){ if(getComputedStyle(a).position==="fixed"){fx=true;break;} } if(!fx) return true; }
    return false;
  }
  function build(){
    if(document.querySelector(".od-qty")) return true;
    if(!hasNativeInPageBuy()) return false;   /* 모바일처럼 본문 구매 영역이 없는 화면은 아래 '모바일 구매 영역'이 대신 그림 */
    /* 위치: 카카오 쿠폰 버튼들 아래 → 없으면 아임웹 '구매하면 … 추가 할인' 띠 위 */
    var anchor = document.querySelector(".od-kcoupon.is-channel") || document.querySelectorAll(".od-kcoupon")[0];
    var promo = null, els = document.querySelectorAll("div,p,span");
    for(var i=0;i<els.length;i++){ var t=els[i].textContent.replace(/\s+/g,""); if(/개이상구매하면.*추가할인/.test(t) && t.length<30){ promo = els[i]; } }
    if(!anchor && !promo) return false;

    var wrap = document.createElement("div"); wrap.className = "od-qty";
    wrap.appendChild((function(){ var hd=document.createElement("div"); hd.className="od-qty-head"; hd.innerHTML = window.__odIsGuest() ? '<span>회원 전용 세트가</span><a class="od-qty-login" href="'+window.__odLoginHref()+'"><u>카카오 1초 가입</u> 후 적용</a>' : '<span>회원 전용 세트가</span><small>회원·카카오 회원 적용</small>'; return hd; })());
    P.tiers.forEach(function(t){
      var unit = Math.round(P.member * (100 - t.rate) / 100 / 10) * 10, total = unit * t.n;
      var off = Math.floor((1 - unit / P.base) * 100 + 1e-6);
      var btn = document.createElement("button"); btn.type = "button";
      btn.className = "od-qty-card" + (t.flag ? " has-flag" : ""); btn.setAttribute("data-n", t.n);
      btn.innerHTML =
        (t.flag ? '<span class="od-qty-flag">'+t.flag+'</span>' : '') +
        '<div class="od-qty-l"><div class="od-qty-sub">'+t.sub+'</div><div class="od-qty-name">'+t.name+
          (total >= P.free ? '<span class="od-qty-tag">무료배송</span>' : '')+'</div></div>' +
        '<div class="od-qty-r"><span class="od-qty-off">-'+off+'%</span>' +
          '<div class="od-qty-unit">'+won(unit)+(t.n>1?'<small>/ 1개당</small>':'')+'</div>' +
          (t.n>1 ? '<div class="od-qty-total">총 '+won(total)+'</div>' : '') + '</div>';
      btn.addEventListener("click", function(){
        /* 비회원도 선택 가능 (결제 금액은 비회원가로 계산됨) */
        wrap.querySelectorAll(".od-qty-card").forEach(function(c){ c.classList.toggle("is-on", c===btn); });
        setQty(t.n);
      });
      wrap.appendChild(btn);
    });

    if(promo){ var pw = promo; while(pw.parentElement && pw.parentElement.textContent.replace(/\s+/g,"") === promo.textContent.replace(/\s+/g,"")) pw = pw.parentElement; pw.parentNode.insertBefore(wrap, pw); pw.style.setProperty("display","none","important"); }
    else anchor.parentNode.insertBefore(wrap, anchor.nextSibling);
    var cur = qtyInput(); var cv = cur ? parseInt(cur.value,10) : 1;
    wrap.querySelectorAll(".od-qty-card").forEach(function(c){ c.classList.toggle("is-on", +c.getAttribute("data-n") === (cv>=3?3:cv)); });
    return true;
  }
  function start(){
    if(build()) return;
    var mo = new MutationObserver(function(){ if(build()) mo.disconnect(); });
    mo.observe(document.body, {childList:true, subtree:true});
    setTimeout(function(){ mo.disconnect(); }, 15000);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>

<!-- ============================================================
     상품 페이지: 구매 영역 따라오기
     - PC(1024px 이상): 오른쪽 구매 칸은 처음엔 페이지와 같이 내려가다가, 구매하기 버튼까지 다 보이면 그때부터 화면에 붙어 따라옴
     - 모바일: 본문 구매하기 버튼을 지나 내려가면 하단 구매 바(장바구니·구매하기)가 나타남
     ============================================================ -->
<style>
  /* 칸 안 스크롤 없음: 페이지와 함께 내려가다가, 칸의 맨 아래(구매하기 버튼)가 화면 아래에 닿으면 그 자리에 붙어서 따라옴 */
  .od-sticky-col{ position:sticky !important; top:var(--od-top,90px) !important; align-self:flex-start !important; }

  .od-buybar{ position:fixed; left:0; right:0; bottom:0; z-index:2147482000; background:#fff; border-top:1px solid rgba(30,42,58,.12);
    box-shadow:0 -6px 20px rgba(30,42,58,.08); transform:translateY(110%); transition:transform .28s cubic-bezier(.22,.61,.36,1);
    font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:#1E2A3A; }
  .od-buybar.is-on{ transform:none; }
  .od-buybar-in{ display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); box-sizing:border-box; }
  .od-buybar button{ height:50px; border-radius:999px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; letter-spacing:.02em; }
  .od-buybar .od-cart{ flex:0 0 34%; background:#fff; color:#1b3a5c; border:1px solid #1b3a5c; }
  .od-buybar .od-buy{ flex:1; background:#1b3a5c; color:#fff; border:1px solid #1b3a5c; }
</style>
<script>
(function(){
  if(!/[?&]idx=\d+/.test(location.search)) return;
  /* 상품 상세페이지에서만 (방향찾기 설문처럼 주소에 idx가 붙은 일반 페이지는 제외) */
  if(document.body && !document.body.classList.contains("shop_view")) return;
  var PC = function(){ return window.innerWidth >= 1024; };
  function txt(el){ return (el.textContent||"").replace(/\s+/g,""); }
  function fixedAncestor(el){ for(var e=el; e && e!==document.body; e=e.parentElement){ var p=getComputedStyle(e).position; if(p==="fixed") return e; } return null; }
  function inPage(re){
    var els = document.querySelectorAll("a,button");
    for(var i=0;i<els.length;i++){ var e=els[i]; if(e.closest(".od-buybar")) continue; if(re.test(txt(e)) && txt(e).length<12 && e.offsetParent!==null && !fixedAncestor(e)) return e; }
    return null;
  }
  function nativeBar(){
    var els = document.querySelectorAll("div,section,footer,nav,form");
    for(var i=0;i<els.length;i++){
      var e=els[i]; if(e.closest(".od-buybar")) continue;
      var cs=getComputedStyle(e); if(cs.position!=="fixed" || cs.display==="none") continue;
      if(!/구매하기|바로구매/.test(txt(e))) continue;
      var r=e.getBoundingClientRect(); if(r.height>0 && r.height<220 && r.bottom >= window.innerHeight-4) return e;
    }
    return null;
  }
  function headerH(){
    var hd = document.querySelector("header, #doz_header, .doz_header, [class*='header_fixed'], [id*='header']");
    if(!hd) return 90; var cs=getComputedStyle(hd), r=hd.getBoundingClientRect();
    return (cs.position==="fixed"||cs.position==="sticky") && r.top<=0 ? Math.max(0, r.bottom) + 16 : 24;
  }

  /* ---------- PC: 오른쪽 칸 붙이기 ---------- */
  var col = null;
  function stickPC(){
    var buy = inPage(/^(구매하기|바로구매)$/); if(!buy) return false;
    /* 구매 버튼을 품은 상자 중, 가로로 나란한 두 칸 중 하나인 것(오른쪽 정보 칸) */
    var c = buy;
    while(c.parentElement && c.parentElement !== document.body){
      var p = c.parentElement, pr = p.getBoundingClientRect(), cr = c.getBoundingClientRect();
      if(cr.width < pr.width * 0.7 && pr.width > window.innerWidth * 0.55){
        var sib = Array.prototype.some.call(p.children, function(s){ if(s===c) return false; var r=s.getBoundingClientRect(); return r.width>100 && r.height>200 && Math.abs(r.top - cr.top) < 200; });
        if(sib) break;
      }
      c = p;
    }
    if(c === buy || c.parentElement === document.body) return false;
    col = c;
    /* sticky가 먹도록 위쪽 상자들의 overflow 숨김을 풀어 줌 */
    for(var a=c.parentElement; a && a!==document.body; a=a.parentElement){
      var cs=getComputedStyle(a); if(/(hidden|auto|scroll)/.test(cs.overflowY) || /(hidden|auto|scroll)/.test(cs.overflow)) a.style.setProperty("overflow","visible","important");
    }
    var pcs = getComputedStyle(c.parentElement);
    if(pcs.display.indexOf("flex")===-1 && pcs.display.indexOf("grid")===-1 && getComputedStyle(c).float==="none"){ /* 일반 블록 배치면 sticky가 의미 없음 */ }
    col.classList.add("od-sticky-col");
    setTop();
    return true;
  }
  function setTop(){
    if(!col) return;
    var hh = headerH(), vh = window.innerHeight;
    /* 기준은 칸 안의 '구매하기' 버튼: 버튼이 화면 아래에 닿는 순간부터 고정 */
    var buy = inPage(/^(구매하기|바로구매)$/), ch = col.offsetHeight;
    if(buy && col.contains(buy)) ch = buy.getBoundingClientRect().bottom - col.getBoundingClientRect().top;
    var top = (ch + hh + 24 <= vh) ? hh : (vh - ch - 24);   /* 짧으면 헤더 아래에 바로 붙고, 길면 구매하기 버튼이 화면 바닥에 닿는 위치 */
    document.documentElement.style.setProperty("--od-top", top+"px");
  }
  function unstickPC(){ if(col){ col.classList.remove("od-sticky-col"); } }

  /* ---------- 모바일: 하단 구매 바 ---------- */
  var bar=null, nat=null, on=null;
  function makeBar(){
    bar = document.createElement("div"); bar.className="od-buybar";
    bar.innerHTML = '<div class="od-buybar-in"><button type="button" class="od-cart">장바구니</button><button type="button" class="od-buy">구매하기</button></div>';
    bar.querySelector(".od-buy").onclick = function(){ if(window.__odOpenNative){ window.__odOpenNative("buy"); return; } var b=inPage(/^(구매하기|바로구매)$/); if(b) b.click(); else if(nat){ var nb=[].find.call(nat.querySelectorAll("a,button"),function(x){return /구매/.test(txt(x));}); if(nb) nb.click(); } };
    bar.querySelector(".od-cart").onclick = function(){ if(window.__odOpenNative){ window.__odOpenNative("cart"); return; } var c=inPage(/^장바구니$/); if(c) c.click(); else if(nat){ var nc=[].find.call(nat.querySelectorAll("a,button"),function(x){return /장바구니/.test(txt(x));}); if(nc) nc.click(); } };
    document.body.appendChild(bar);
  }
  /* 기본 바 숨김: display:none 대신 화면 아래로 내림 → 구매창(옵션 시트)이 그 안에서 열려도 다시 보이게 할 수 있음 */
  function sheetOpen(){
    return [].some.call(document.querySelectorAll("input"), function(i){ if(i.offsetParent===null || i.closest(".od-mbuy") || !/^\d+$/.test(i.value)) return false;
      for(var a=i;a&&a!==document.body;a=a.parentElement){ if(getComputedStyle(a).position==="fixed") return true; } return false; });
  }
  function hideNative(){
    if(!nat) return;
    var opening = window.__odNativeOpen && (Date.now() - window.__odNativeOpen < 1500 || sheetOpen());
    if(!opening) window.__odNativeOpen = 0;
    nat.style.setProperty("transform", opening ? "none" : "translateY(140%)", "important");
    nat.style.setProperty("pointer-events", opening ? "" : "none", "important");
    if(bar) bar.style.visibility = opening ? "hidden" : "";
  }
  function mobile(){
    var buy = inPage(/^(구매하기|바로구매)$/);
    hideNative();   /* 아임웹 기본 하단 바는 숨기고 우리 바로 통일 (구매창이 열릴 땐 잠시 보임) */
    if(!bar) makeBar();
    var show = buy ? buy.getBoundingClientRect().bottom < 0 : true;   /* 본문 버튼이 없으면 항상 표시 */
    if(show === on) return; on = show;
    bar.classList.toggle("is-on", show);
  }

  function update(){
    if(PC()){ if(bar) bar.classList.remove("is-on"); if(nat){ nat.style.removeProperty("display"); nat.style.removeProperty("transform"); nat.style.removeProperty("pointer-events"); } on=null; if(!col || !col.classList.contains("od-sticky-col")) stickPC(); else setTop(); }
    else { unstickPC(); mobile(); }
  }
  function start(){
    var tries=0, t=setInterval(function(){
      nat = nat || nativeBar();
      if(inPage(/^(구매하기|바로구매)$/) || ++tries>40){ clearInterval(t); update(); window.addEventListener("scroll", function(){ if(!PC()) mobile(); }, {passive:true}); window.addEventListener("resize", function(){ on=null; update(); }); setInterval(function(){
          if(PC()){ setTop(); return; }
          /* 모바일: 아임웹 기본 하단 바가 늦게 그려져도 찾아서 숨기고, 본문 버튼 위치를 다시 확인 */
          var n = nativeBar(); if(n && n!==nat){ nat = n; }
          on = null; mobile();
        }, 500); }
    }, 150);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>

<!-- ============================================================
     모바일 상품 페이지: 배송 정보 아래에 구매 영역 (수량별 카드 + 수량 + 총 금액 + 구매하기·장바구니·찜)
     아임웹 모바일은 본문에 구매 버튼이 없고 하단 바만 있어서, 본문 구매 영역을 새로 만든다.
     구매하기·장바구니는 아임웹 기본 구매창(옵션 시트)을 열고 고른 수량을 맞춰 준다.
     ============================================================ -->
<style>
  .od-mbuy{ margin:24px 0 8px; font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:#1E2A3A; word-break:keep-all; }
  .od-mbuy *{ box-sizing:border-box; }
  .od-mbuy .od-qty{ margin:0 0 14px; }
  .od-mqty{ background:#F7F7F8; border-radius:4px; padding:14px 14px 16px; }
  .od-mqty-label{ font-size:13px; padding-bottom:12px; border-bottom:1px dashed rgba(30,42,58,.15); margin-bottom:14px; }
  .od-mqty-row{ display:flex; align-items:center; justify-content:space-between; }
  .od-step{ display:flex; border:1px solid rgba(30,42,58,.25); background:#fff; }
  .od-step button{ width:34px; height:32px; border:0; background:#fff; font-size:18px; line-height:1; color:#1E2A3A; cursor:pointer; padding:0; }
  .od-step input{ width:44px; height:32px; border:0; border-left:1px solid rgba(30,42,58,.25); border-right:1px solid rgba(30,42,58,.25); text-align:center; font-size:14px; padding:0; border-radius:0; -webkit-appearance:none; }
  .od-mqty-price{ font-size:14px; }
  .od-mtotal{ display:flex; align-items:baseline; justify-content:space-between; padding:16px 2px; border-top:1px solid rgba(30,42,58,.12); margin-top:14px; }
  .od-mtotal small{ font-size:13px; color:#6E8299; }
  .od-mtotal strong{ font-size:20px; font-weight:700; }
  .od-mbuy .od-mline{ margin:-10px 2px 14px; }
  .od-mbtns{ display:grid; grid-template-columns:1.2fr 1fr .8fr; gap:8px; }

<script>
(function(){
  var m = location.search.match(/[?&]idx=(\d+)/); if(!m) return;
  var CFG = { "1": { member:26800, base:32000, free:50000,
    tiers:[ {n:1, sub:"처음 써보는 분께", name:"단품 1개", rate:0},
            {n:2, sub:"나눠 쓰기 좋은", name:"2개 세트", rate:5, flag:"BEST"},
            {n:3, sub:"가장 큰 혜택", name:"3개 세트", rate:10, flag:"최대할인"} ] } }[m[1]];
  if(!CFG) return;
  var won = function(v){ return v.toLocaleString("ko-KR")+"원"; };
  function txt(el){ return (el.textContent||"").replace(/\s+/g,""); }
  function isFixed(el){ for(var a=el;a&&a!==document.body;a=a.parentElement){ if(getComputedStyle(a).position==="fixed") return a; } return null; }
  function rate(n){ var r=0; CFG.tiers.forEach(function(t){ if(n>=t.n) r=t.rate; }); return r; }
  function unit(n){ return Math.round(CFG.member*(100-rate(n))/100/10)*10; }
  /* 본문 수량·총액: 회원은 회원가, 비회원은 판매가 기준 (수량별 할인은 둘 다 적용) */
  function payUnit(n){ var p = window.__odIsGuest() ? CFG.base : CFG.member; return Math.round(p*(100-rate(n))/100/10)*10; }

  function hasNativeInPageBuy(){
    var els=document.querySelectorAll("a,button");
    for(var i=0;i<els.length;i++){ var e=els[i]; if(e.closest(".od-buybar,.od-mbuy")) continue;
      if(/^(구매하기|바로구매)$/.test(txt(e)) && e.offsetParent!==null && !isFixed(e)) return true; }
    return false;
  }
  /* 아임웹 기본 하단 바 안의 버튼 (숨겨져 있어도 찾음) */
  function nativeBtn(re){
    var els=document.querySelectorAll("a,button");
    for(var i=0;i<els.length;i++){ var e=els[i]; if(e.closest(".od-buybar,.od-mbuy")) continue;
      if(re.test(txt(e)) && isFixed(e) && e.offsetParent!==null) return e; }   /* 화면에 그려진(접힌 시트 안이 아닌) 버튼 우선 */
    for(var k=0;k<els.length;k++){ var g=els[k]; if(g.closest(".od-buybar,.od-mbuy")) continue;
      if(re.test(txt(g)) && isFixed(g)) return g; }
    for(var j=0;j<els.length;j++){ var f=els[j]; if(f.closest(".od-buybar,.od-mbuy")) continue; if(re.test(txt(f))) return f; }
    return null;
  }
  /* 기본 구매창이 열리면 그 안의 수량을 맞춘다 */
  function setSheetQty(n){
    var tries=0;
    (function wait(){
      var ins=[].filter.call(document.querySelectorAll('input'), function(i){ return i.offsetParent!==null && /^\d+$/.test(i.value) && !i.closest(".od-mbuy") && isFixed(i); });
      if(!ins.length){ if(++tries<30) setTimeout(wait,100); return; }
      var inp=ins[0], box=inp.parentElement, bs=box.querySelectorAll("button,a,span,i"), minus=bs[0], plus=bs[bs.length-1], g=0;
      window.__odSetQty(inp, n, minus, plus);
    })();
  }

  var qty=1, el=null;
  function render(){
    if(!el) return;
    el.querySelector(".od-step input").value=qty;
    el.querySelector(".od-mqty-price").textContent=won(payUnit(qty)*qty);
    el.querySelector(".od-mtotal small").textContent="총 상품금액("+qty+"개)";
    el.querySelector(".od-mtotal strong").textContent=won(payUnit(qty)*qty);
    el.querySelector(".od-mnote").textContent = window.__odIsGuest() ? "비회원은 판매가 기준 · 회원 전용 세트가는 로그인 후 적용" : "회원가 기준 금액입니다";
    /* 비회원: 총 상품금액 아래에 회원가입 시 적용가 */
    var ml=el.querySelector(".od-mline");
    if(window.__odIsGuest()){
      if(!ml){ ml=document.createElement("div"); ml.className="od-mline"; el.querySelector(".od-mtotal").insertAdjacentElement("afterend", ml); }
      var mt=unit(qty)*qty, sv=payUnit(qty)*qty-mt;
      ml.innerHTML='<span>회원가</span><strong>'+won(mt)+'</strong>';
    } else if(ml){ ml.remove(); }
    el.querySelectorAll(".od-qty-card").forEach(function(c){ c.classList.toggle("is-on", +c.getAttribute("data-n")===Math.min(qty,3)); });
  }
  function build(){
    if(document.querySelector(".od-mbuy")) return true;
    if(window.innerWidth>=1024 || hasNativeInPageBuy()) return false;
    /* 위치: '적립·혜택·구매·배송' 정보 표 바로 아래 */
    var spot=null, els=document.querySelectorAll("div,table,dl,ul,section");
    for(var i=0;i<els.length;i++){ var t=txt(els[i]); if(/적립/.test(t) && /배송/.test(t) && /무료배송|기본/.test(t) && t.length<400 && !els[i].closest(".od-mbuy")) spot=els[i]; }
    if(!spot){ var ch=document.querySelector(".od-kcoupon.is-channel"); if(ch) spot=ch; }
    if(!spot) return false;
    /* 가장 작은 상자 고르기: 같은 조건을 만족하는 것 중 마지막(=가장 안쪽)이 spot. 그 바로 뒤에 넣음 */

    el=document.createElement("div"); el.className="od-mbuy";
    var cards='<div class="od-qty">' + (function(){ var hd=document.createElement("div"); hd.className="od-qty-head"; hd.innerHTML = window.__odIsGuest() ? '<span>회원 전용 세트가</span><a class="od-qty-login" href="'+window.__odLoginHref()+'"><u>카카오 1초 가입</u> 후 적용</a>' : '<span>회원 전용 세트가</span><small>회원·카카오 회원 적용</small>'; return hd; })().outerHTML;
    CFG.tiers.forEach(function(t){
      var u=unit(t.n), tot=u*t.n, off=Math.floor((1-u/CFG.base)*100+1e-6);
      cards+='<button type="button" class="od-qty-card'+(t.flag?' has-flag':'')+'" data-n="'+t.n+'">'+(t.flag?'<span class="od-qty-flag">'+t.flag+'</span>':'')+
        '<div class="od-qty-l"><div class="od-qty-sub">'+t.sub+'</div><div class="od-qty-name">'+t.name+(tot>=CFG.free?'<span class="od-qty-tag">무료배송</span>':'')+'</div></div>'+
        '<div class="od-qty-r"><span class="od-qty-off">-'+off+'%</span><div class="od-qty-unit">'+won(u)+(t.n>1?'<small>/ 1개당</small>':'')+'</div>'+(t.n>1?'<div class="od-qty-total">총 '+won(tot)+'</div>':'')+'</div></button>';
    });
    cards+='</div>';
    var wishCount=(function(){ var w=document.querySelector('[class*="wish" i],[class*="like" i]'); var mm=w&&w.textContent.match(/\d+/); return mm?mm[0]:""; })();
    el.innerHTML = cards +
      '<div class="od-mqty"><div class="od-mqty-label">수량</div><div class="od-mqty-row"><div class="od-step"><button type="button" data-d="-1" aria-label="수량 빼기">−</button><input type="text" inputmode="numeric" value="1" aria-label="수량"><button type="button" data-d="1" aria-label="수량 더하기">+</button></div><div class="od-mqty-price"></div></div></div>' +
      '<div class="od-mtotal"><small></small><strong></strong></div>' +
      '<div class="od-mbtns"><button type="button" class="od-m-buy">구매하기</button><button type="button" class="od-m-cart">장바구니</button>' +
      '<button type="button" class="od-m-wish" aria-label="찜하기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>'+wishCount+'</span></button></div>' +
      '<div class="od-mnote">회원가 기준 금액입니다</div>';
    spot.parentNode.insertBefore(el, spot.nextSibling);

    el.querySelectorAll(".od-qty-card").forEach(function(c){ c.onclick=function(){ qty=+c.getAttribute("data-n"); render(); }; });
    el.querySelectorAll(".od-step button").forEach(function(b){ b.onclick=function(){ qty=Math.max(1, qty+(+b.getAttribute("data-d"))); render(); }; });
    el.querySelector(".od-step input").onchange=function(){ qty=Math.max(1, parseInt(this.value,10)||1); render(); };
    function openNative(btn){ window.__odNativeOpen = Date.now(); var fx=isFixed(btn); if(fx){ fx.style.setProperty("transform","none","important"); fx.style.setProperty("pointer-events","","important"); } setTimeout(function(){ btn.click(); setSheetQty(qty); }, 30); }
    /* 본문 버튼과 하단 바 버튼이 같은 동작을 쓰도록 공용 함수로 */
    window.__odOpenNative = function(kind){ var b = kind==="cart" ? nativeBtn(/^장바구니$/) : nativeBtn(/^(구매하기|바로구매)$/); if(b) openNative(b); };
    el.querySelector(".od-m-buy").onclick=function(){ window.__odOpenNative("buy"); };
    el.querySelector(".od-m-cart").onclick=function(){ window.__odOpenNative("cart"); };
    el.querySelector(".od-m-wish").onclick=function(){
      var w=document.querySelector('[class*="wish" i]:not(.od-m-wish),[class*="like" i]:not(.od-m-wish)'); if(w) w.click();
      var me=this; setTimeout(function(){ var mm=w&&w.textContent.match(/\d+/); if(mm) me.querySelector("span").textContent=mm[0]; me.classList.toggle("is-on"); }, 400);
    };
    render();
    return true;
  }
  function start(){
    var n=0, t=setInterval(function(){ if(build() || ++n>60) clearInterval(t); }, 200);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>

<!-- ============================================================
     모바일 구매창(아임웹 옵션 시트)이 열렸을 때
     - 시트 안에 수량별 혜택 카드 넣기 (누르면 시트 수량이 바뀜)

<style>

  /* 아이폰 사파리에서 아임웹이 글자색을 -webkit-text-fill-color 로 덮어써서 color 만으로는 안 바뀜 → 둘 다 지정 */
  /* 비회원: 총 상품금액 숫자 바로 아래, 오른쪽 정렬 빨간 글씨 '회원가 00,000원' */
  .od-mline{ display:block; text-align:right; margin:4px 0 0; line-height:1.2; white-space:nowrap; font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  .od-mline, .od-mline *{ color:#E03131 !important; -webkit-text-fill-color:#E03131 !important; }
  .od-mline span{ font-size:13px; font-weight:600; margin-right:6px; }
  .od-mline strong{ font-size:17px; font-weight:800; }
  .od-rate, .od-rate *{ color:#E03131 !important; -webkit-text-fill-color:#E03131 !important; font-weight:700 !important; margin-left:6px; }
  .od-qty .od-qty-flag, .od-qty .od-qty-off, .od-qty .od-qty-flag *, .od-qty .od-qty-off *{ color:#fff !important; -webkit-text-fill-color:#fff !important; opacity:1 !important; }
</style>
<script>
(function(){
  var m = location.search.match(/[?&]idx=(\d+)/); if(!m) return;
  var CFG = { "1": { member:26800, base:32000, free:50000,
    tiers:[ {n:1, name:"단품 1개", rate:0}, {n:2, name:"2개 세트", rate:5, flag:"BEST"}, {n:3, name:"3개 세트", rate:10, flag:"최대할인"} ] } }[m[1]];
  if(!CFG) return;
  var won = function(v){ return v.toLocaleString("ko-KR")+"원"; };
  function txt(el){ return (el.textContent||"").replace(/\s+/g,""); }
  function fixedOf(el){ for(var a=el;a&&a!==document.body;a=a.parentElement){ if(getComputedStyle(a).position==="fixed") return a; } return null; }
  function sheetInput(){
    var ins=document.querySelectorAll("input");
    for(var i=0;i<ins.length;i++){ var x=ins[i]; if(x.offsetParent===null || x.closest(".od-mbuy,.od-buybar") || !/^\d+$/.test(x.value)) continue; var f=fixedOf(x); if(f && x.getBoundingClientRect().top < window.innerHeight) return {inp:x, sheet:f}; }
    return null;
  }
  function setQty(inp, n){
    var bs=inp.parentElement.querySelectorAll("button,a,span,i");
    window.__odSetQty(inp, n, bs[0], bs[bs.length-1]);
  }
  function cards(inp){
    var w=document.createElement("div"); w.className="od-qty is-sheet";
    w.appendChild((function(){ var hd=document.createElement("div"); hd.className="od-qty-head"; hd.innerHTML = window.__odIsGuest() ? '<span>회원 전용 세트가</span><a class="od-qty-login" href="'+window.__odLoginHref()+'"><u>카카오 1초 가입</u> 후 적용</a>' : '<span>회원 전용 세트가</span><small>회원·카카오 회원 적용</small>'; return hd; })());
    CFG.tiers.forEach(function(t){
      var u=Math.round(CFG.member*(100-t.rate)/100/10)*10, tot=u*t.n, off=Math.floor((1-u/CFG.base)*100+1e-6);
      var b=document.createElement("button"); b.type="button"; b.className="od-qty-card"+(t.flag?" has-flag":""); b.setAttribute("data-n",t.n);
      b.innerHTML=(t.flag?'<span class="od-qty-flag">'+t.flag+'</span>':'')+'<div class="od-qty-l"><div class="od-qty-name">'+t.name+(tot>=CFG.free?'<span class="od-qty-tag">무료배송</span>':'')+'</div></div>'+
        '<div class="od-qty-r"><span class="od-qty-off">-'+off+'%</span><div class="od-qty-unit">'+won(u)+(t.n>1?'<small>/ 1개당</small>':'')+'</div></div>';
      b.onclick=function(){ setQty(inp, t.n); };
      w.appendChild(b);
    });
    return w;
  }
  /* 시트 안 가격 글자들 (위→아래 순서): [수량 옆 금액, (수량별 할인), 총 상품금액] */
  function priceVal(el){ var t=""; el.childNodes.forEach(function(n){ if(n.nodeType===3) t+=n.nodeValue; }); return parseInt(t.replace(/[^\d]/g,""),10)||0; }
  function priceEls(sheet){
    var out=[], wk=document.createTreeWalker(sheet, NodeFilter.SHOW_TEXT, null), n;
    while((n=wk.nextNode())){ var pe=n.parentElement; if(!pe || pe.closest(".od-qty,.od-rate,.od-mline")) continue; if(/^\s*-?[\d,]+\s*원\s*$/.test(n.nodeValue) && pe.offsetParent!==null) out.push(pe); }
    return out;
  }
  /* 할인율 표시 공용: scope 안의 '수량별 할인' 글자 옆에 (총 상품금액 ÷ 판매가×수량) 기준 할인율 */
  function applyRate(scope, qty){
    var ps=priceEls(scope); if(ps.length<1) return;
    var row=ps[0], total=ps[ps.length-1];
    var tv=priceVal(total), base=CFG.base*qty;
    var off=base && tv ? Math.floor((1-tv/base)*100+1e-6) : 0;
    var label=null, lw=document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null), ln;
    while((ln=lw.nextNode())){ if(/수량별\s*할인/.test(ln.nodeValue) && ln.parentElement && !ln.parentElement.closest(".od-qty,.od-mbuy") && ln.parentElement.offsetParent!==null){ label=ln.parentElement; break; } }
    var host = label || row;
    scope.querySelectorAll(".od-rate").forEach(function(r){ if(r.parentElement!==host) r.remove(); });
    var tag=host.querySelector(".od-rate");
    if(off>0){ if(!tag){ tag=document.createElement("span"); tag.className="od-rate"; tag.style.setProperty("color","#E03131","important"); tag.style.setProperty("-webkit-text-fill-color","#E03131","important"); if(label) host.appendChild(tag); else host.insertBefore(tag,host.firstChild); } tag.textContent=off+"%"; }
    else if(tag){ tag.remove(); }
  }
  /* 비회원: '총 상품금액' 줄 바로 아래에 회원가입 시 실제 적용 금액 */
  function memberLine(scope, qty){
    var old=scope.querySelector(".od-mline");
    if(!window.__odIsGuest()){ if(old) old.remove(); return; }
    var ps=priceEls(scope); if(!ps.length) return;
    var total=ps[ps.length-1];
    var r=0; CFG.tiers.forEach(function(t){ if(qty>=t.n) r=t.rate; });
    var mUnit=Math.round(CFG.member*(100-r)/100/10)*10, mTot=mUnit*qty;
    var gTot=priceVal(total), save=gTot-mTot;
    /* 총 상품금액 숫자 칸 안쪽 맨 아래에 넣어서 숫자 바로 밑에 붙게 */
    if(old && old.parentElement!==total){ old.remove(); old=null; }
    if(!old){ old=document.createElement("div"); old.className="od-mline"; total.appendChild(old); total.style.setProperty("text-align","right","important"); }
    var key=qty+"|"+mTot+"|"+save; if(old.getAttribute("data-k")===key) return; old.setAttribute("data-k",key);
    old.innerHTML='<span>회원가</span><strong>'+won(mTot)+'</strong>';
  }
  /* PC 본문 구매 영역(화면 고정이 아닌 곳)의 '수량별 할인' */
  function pcRate(){
    var ins=document.querySelectorAll("input"), inp=null;
    for(var i=0;i<ins.length;i++){ var x=ins[i]; if(x.offsetParent===null || x.closest(".od-mbuy,.od-buybar") || !/^\d+$/.test(x.value) || fixedOf(x)) continue; inp=x; break; }
    if(!inp) return;
    /* 수량 칸과 '총 상품금액'을 함께 품은 가장 작은 상자 */
    var scope=inp; while(scope && scope!==document.body && !/총상품금액/.test(txt(scope))) scope=scope.parentElement;
    if(!scope || scope===document.body) return;
    applyRate(scope, parseInt(inp.value,10)||1);
    memberLine(scope, parseInt(inp.value,10)||1);
  }
  function tick(){
    pcRate();
    var s=sheetInput();
    document.documentElement.classList.toggle("od-sheet-open", !!s);
    if(!s) return;
    var sheet=s.sheet, inp=s.inp, qty=parseInt(inp.value,10)||1;

    /* 1) 수량별 카드 넣기: 아임웹 '…구매하면 …추가 할인!' 띠 자리에, 없으면 수량 칸 위에 */
    if(!sheet.querySelector(".od-qty")){
      var strip=null, els=sheet.querySelectorAll("div,p,span");
      for(var i=0;i<els.length;i++){ var t=txt(els[i]); if(/구매하면.*추가할인/.test(t) && t.length<30) strip=els[i]; }
      if(strip){ var sw=strip; while(sw.parentElement && sw.parentElement!==sheet && txt(sw.parentElement)===txt(strip)) sw=sw.parentElement; sw.parentNode.insertBefore(cards(inp), sw); sw.style.setProperty("display","none","important"); }
      else { var box=inp; while(box.parentElement && box.parentElement!==sheet && !/수량/.test(txt(box.parentElement).slice(0,4))) box=box.parentElement; box=box.parentElement||box; box.parentNode.insertBefore(cards(inp), box); }
    }
    sheet.querySelectorAll(".od-qty-card").forEach(function(c){ c.classList.toggle("is-on", +c.getAttribute("data-n")===Math.min(qty,3)); });

    /* 2) 할인율, 비회원이면 회원가 적용 금액 */
    applyRate(sheet, qty);
    memberLine(sheet, qty);
  }
  setInterval(tick, 250);
})();
</script>

<script>
/* 남색 뱃지(BEST·최대할인·-16% 등) 글씨를 흰색으로 강제 (테마·구매창 스타일보다 우선) */
(function(){
  function paint(){
    document.querySelectorAll(".od-qty-flag, .od-qty-off").forEach(function(e){
      if(e.getAttribute("data-od-w")) return; e.setAttribute("data-od-w","1");
      e.style.setProperty("color","#fff","important"); e.style.setProperty("-webkit-text-fill-color","#fff","important"); e.style.setProperty("opacity","1","important");
    });
  }
  setInterval(paint, 300);
})();
</script>
