<!-- Ondirev 방향 찾기 (Compass + Skin Print)
     아임웹: '방향 찾기' 페이지 → 섹션 하나(풀폭, 상하 여백 0) → 코드 위젯 → 이 파일 전체를 붙여넣기.
     스타일은 .odv-root 안에만 적용되고, 스크립트는 함수 하나로 감싸 사이트의 다른 코드와 이름이 겹치지 않는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
.odv-root{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);overflow-x:hidden;
  background:linear-gradient(180deg,#F7F9FC 0%,#EEF3F8 100%);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;letter-spacing:-.02em;word-break:keep-all;text-align:left}
.odv-root h1,.odv-root h2,.odv-root h3,.odv-root h4,.odv-root p,.odv-root ol,.odv-root ul{font-family:inherit;color:inherit;padding:0}
.odv-root button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;text-transform:none;line-height:inherit;min-height:0}
.odv-root a{text-decoration:none}
.odv-root img{max-width:100%;border:0}
.odv-root svg{display:inline-block}
.odv-root{
  --ink:#1E2A3A; --navy:#1B3A5C; --mute:#4A5D73; --soft:#6B7E93;
  --line:#E1E8F0; --tint:#F2F6FA; --sky:#DCE8F4; --skyd:#A8C8E8; --paper:#FFFFFF; --warn:#B0563F;
  --font:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme: light;
}
.odv-root *{box-sizing:border-box}
.odv-root button{font:inherit;color:inherit}
.odv-root #odv-app{max-width:460px;margin:0 auto;min-height:100%;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px max(28px,env(safe-area-inset-bottom,0px))}
.odv-root a{color:var(--navy)}
.odv-root :focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.odv-root .brand{font-size:12.5px;letter-spacing:.45em;color:var(--ink);text-align:center;padding-left:.45em;font-weight:500}
.odv-root .cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--navy);color:#fff;border:0;border-radius:18px;padding:19px 0;font-size:16.5px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 14px 30px -16px rgba(27,58,92,.7);transition:transform .15s}
.odv-root .cta:active{transform:scale(.98)}
.odv-root .cta svg{stroke:#fff}
.odv-root .cta.light{background:var(--paper);color:var(--navy);box-shadow:none;border:1.5px solid var(--line)}
.odv-root .cta.light svg{stroke:var(--navy)}
.odv-root .pop{animation:odv-pop .45s cubic-bezier(.2,.8,.2,1) both}
.odv-root .pop.d1{animation-delay:.05s}
.odv-root .pop.d2{animation-delay:.1s}
.odv-root .pop.d3{animation-delay:.15s}
@keyframes odv-pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.odv-root .compass{position:relative;margin:0 auto}
.odv-root .compass>svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:visible;filter:drop-shadow(0 10px 22px rgba(27,58,92,.10))}
.odv-root .compass .needle{transform-box:view-box;transform-origin:150px 150px;transition:transform .95s cubic-bezier(.3,1.45,.5,1)}
.odv-root .compass .needle.wob{animation:odv-wob 3.4s ease-in-out infinite;transition:none}
@keyframes odv-wob{0%,100%{transform:rotate(-36deg)}50%{transform:rotate(30deg)}}
.odv-root .chip{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--soft);white-space:nowrap;padding:3px 9px;border-radius:999px;transition:all .3s ease}
.odv-root .chip.on{background:var(--navy);color:#fff;font-weight:700}
.odv-root .chip.dim{opacity:.4}
.odv-root .lean{margin-top:2px;text-align:center;font-size:14.5px;line-height:1.45;min-height:40px}
.odv-root .lean b{color:var(--navy);font-weight:700}
.odv-root .lean small{display:block;font-size:12.5px;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.odv-root .compass .needle{transition:none}
.odv-root .compass .needle.wob{animation:none}
.odv-root .pop{animation:none}}
.odv-root .intro{min-height:calc(100dvh - 42px);display:flex;flex-direction:column;align-items:center;padding-top:20px}
.odv-root .intro h1{margin:20px 0 0;font-size:28px;font-weight:700;letter-spacing:-.05em;line-height:1.38;text-align:center}
.odv-root .intro h1 span{color:var(--navy)}
.odv-root .intro .lead{margin:10px 0 0;font-size:15px;line-height:1.7;color:var(--mute);text-align:center}
.odv-root .steps3{margin-top:22px;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.odv-root .steps3 div{background:var(--paper);border-radius:16px;padding:14px 10px;text-align:center;font-size:12.5px;line-height:1.45;color:var(--mute);border:1px solid var(--line)}
.odv-root .steps3 b{display:block;font-size:20px;color:var(--navy);margin-bottom:4px;font-weight:700}
.odv-root .intro .grow{flex:1;min-height:22px}
.odv-root .gobar{position:fixed;left:0;right:0;bottom:0;z-index:9990;padding:14px max(18px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(238,243,248,0) 0%,#EEF3F8 28%)}
.odv-root .gobar-in{max-width:460px;margin:0 auto;text-align:center}
.odv-root .gobar .meta{margin-top:8px;font-size:12.5px;color:var(--soft)}
body.odv-intro-on #od-kakao{bottom:118px !important}
.odv-root .intro .meta{margin-top:12px;font-size:12.5px;color:var(--soft)}
.odv-root .qtop{display:flex;align-items:center;gap:12px;height:40px}
.odv-root .back{background:none;border:0;padding:8px 4px 8px 0;color:var(--mute);cursor:pointer;display:flex;align-items:center}
.odv-root .back svg{stroke:currentColor}
.odv-root .pbar{flex:1;display:flex;gap:4px}
.odv-root .pbar i{flex:1;height:4px;border-radius:2px;background:#DDE5EE;transition:background .3s}
.odv-root .pbar i.on{background:var(--navy)}
.odv-root .pnum{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.odv-root .pnum b{color:var(--ink)}
.odv-root .qcard{margin-top:4px;background:var(--paper);border-radius:26px;padding:22px 18px 18px;box-shadow:0 18px 40px -28px rgba(27,58,92,.45)}
.odv-root .qtag{display:inline-flex;align-items:center;gap:6px;background:var(--tint);color:var(--navy);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.odv-root .qtag .ic{stroke:var(--navy)}
.odv-root .qcard h2{margin:12px 0 0;font-size:21px;font-weight:700;letter-spacing:-.045em;line-height:1.45;text-wrap:balance}
.odv-root .qcard .hint{margin:7px 0 0;font-size:13.5px;line-height:1.65;color:var(--soft)}
.odv-root .opts{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.odv-root .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--tint);border:1.5px solid transparent;border-radius:16px;padding:13px 14px;font-size:15px;line-height:1.45;cursor:pointer;color:var(--ink);transition:all .18s}
.odv-root .opt .lv{flex:none;display:flex;gap:3px;align-items:flex-end;height:16px}
.odv-root .opt .lv i{width:4px;border-radius:2px;background:#C9D5E2}
.odv-root .opt .lv i:nth-child(1){height:6px}
.odv-root .opt .lv i:nth-child(2){height:11px}
.odv-root .opt .lv i:nth-child(3){height:16px}
.odv-root .opt .lv i.on{background:var(--navy)}
.odv-root .opt:hover{border-color:#C7D4E2}
.odv-root .opt.sel{background:var(--navy);color:#fff;font-weight:600}
.odv-root .opt.sel .lv i{background:rgba(255,255,255,.35)}
.odv-root .opt.sel .lv i.on{background:#fff}
.odv-root .opts.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.odv-root .opts.grid .opt{justify-content:center;padding:17px 4px}
.odv-root .opts.tight .opt{padding:12px 14px;font-size:14px}
.odv-root .qfoot{margin-top:14px;text-align:center;font-size:12.5px;color:var(--soft)}
.odv-root .hero{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.odv-root .hero .lab{margin-top:6px;font-size:13px;color:var(--soft);font-weight:500}
.odv-root .dirbig{margin-top:6px;display:flex;align-items:center;gap:10px}
.odv-root .dirbig .w{font-size:60px;font-weight:800;letter-spacing:.02em;color:var(--navy);line-height:1}
.odv-root .dirbig .c{background:var(--sky);color:var(--navy);font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px}
.odv-root .hero .role{margin-top:10px;font-size:18px;font-weight:700;letter-spacing:-.04em;text-align:center}
.odv-root .hero .q{margin:8px 0 0;font-size:15px;line-height:1.7;color:var(--mute);text-align:center}
.odv-root .card{margin-top:16px;background:var(--paper);border-radius:24px;padding:22px 18px;box-shadow:0 18px 40px -30px rgba(27,58,92,.45)}
.odv-root .card h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.04em;display:flex;align-items:center;gap:8px}
.odv-root .card h3 .k{font-size:11.5px;font-weight:700;color:var(--navy);background:var(--tint);border-radius:999px;padding:3px 9px;letter-spacing:0}
.odv-root .card .p{margin:10px 0 0;font-size:14.5px;line-height:1.8;color:var(--ink)}
.odv-root .card .p.m{color:var(--mute);font-size:14px}
.odv-root .glance{display:grid;gap:0}
.odv-root .glance>div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.55;align-items:baseline}
.odv-root .glance>div:last-child{border-bottom:0;padding-bottom:0}
.odv-root .glance>div:first-child{padding-top:4px}
.odv-root .glance b{font-size:12.5px;color:var(--soft);font-weight:500}
.odv-root .glance strong{color:var(--navy)}
.odv-root .printwrap{display:flex;flex-direction:column;align-items:center}
.odv-root .legend{margin-top:4px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.odv-root .legend span{font-size:12px;background:var(--tint);border-radius:999px;padding:4px 9px;color:var(--mute)}
.odv-root .legend span.top{background:var(--navy);color:#fff;font-weight:600}
.odv-root .rank{margin-top:12px}
.odv-root .rank>div{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.odv-root .rank>div:last-child{border-bottom:0}
.odv-root .rank b{display:block;font-size:12px;color:var(--soft);font-weight:500;margin-bottom:3px}
.odv-root .rank span{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.odv-root .rank em{font-style:normal;font-weight:700;background:var(--tint);border-radius:8px;padding:2px 9px}
.odv-root .rank small{font-size:11.5px;color:var(--navy);font-weight:500;margin-left:2px}
.odv-root .rank i{font-style:normal;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:2px 8px}
.odv-root .ans{margin-top:10px;background:var(--tint);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55}
.odv-root .ans small{display:block;font-size:11.5px;color:var(--soft);margin-bottom:3px}
.odv-root .avoid{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.odv-root .avoid li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.55;background:#FBF3F0;border-radius:12px;padding:10px 12px}
.odv-root .avoid li::before{content:"✕";flex:none;color:var(--warn);font-weight:700;font-size:12px;line-height:1.9}
.odv-root .rt{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.odv-root .rt>div{background:var(--tint);border-radius:16px;padding:14px 12px}
.odv-root .rt h4{margin:0;font-size:13px;font-weight:700;color:var(--navy)}
.odv-root .rt ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.odv-root .rt li{counter-increment:s;display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;font-size:13px;line-height:1.5}
.odv-root .rt li::before{content:counter(s);width:18px;height:18px;border-radius:50%;background:var(--paper);color:var(--navy);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.odv-root .tl{margin-top:12px;position:relative;padding-left:22px}
.odv-root .tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.odv-root .tl div{position:relative;padding:0 0 14px;font-size:14px;line-height:1.6}
.odv-root .tl div:last-child{padding-bottom:0}
.odv-root .tl div::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--navy)}
.odv-root .tl div:first-child::before{background:var(--navy)}
.odv-root .tl b{display:block;font-size:12px;color:var(--navy);font-weight:700}
.odv-root .nx{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);align-items:center;gap:4px}
.odv-root .nx>div{border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.odv-root .nx .now{background:var(--tint)}
.odv-root .nx .nxt{background:var(--navy);color:#fff}
.odv-root .nx small{font-size:11.5px;opacity:.75;font-weight:500}
.odv-root .nx b{font-size:22px;font-weight:800;letter-spacing:.02em}
.odv-root .nx span{font-size:12px;opacity:.85}
.odv-root .nx svg{justify-self:center}
.odv-root .prod{margin-top:16px;border-radius:24px;background:linear-gradient(150deg,#1B3A5C 0%,#2A5079 100%);color:#fff;padding:24px 20px;display:flex;flex-direction:column;gap:8px}
.odv-root .prod small{font-size:12px;color:#C9D8E8;font-weight:500}
.odv-root .prod b{font-size:19px;font-weight:700;letter-spacing:-.03em}
.odv-root .prod p{margin:0;font-size:13.5px;line-height:1.7;color:#DCE6F1}
.odv-root .prod .cta{background:#fff;color:var(--navy);margin-top:8px;box-shadow:none}
.odv-root .prod .cta svg{stroke:var(--navy)}
.odv-root .share{display:flex;justify-content:center;margin-top:12px}
.odv-root .share img{width:100%;max-width:260px;border-radius:18px;box-shadow:0 20px 40px -24px rgba(27,58,92,.6)}
.odv-root .prodcard{margin-top:16px;background:var(--paper);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px -30px rgba(27,58,92,.45)}
.odv-root .prodcard .ph{position:relative;aspect-ratio:16/11;max-width:100%;background:linear-gradient(160deg,#EAF1F8,#D6E3F0);display:flex;align-items:center;justify-content:center;overflow:hidden}
.odv-root .prodcard .ph img{width:100%;height:100%;object-fit:cover}
.odv-root .prodcard .ph.img{aspect-ratio:1/1;background:#B4D8EC}
.odv-root .prodcard .ph.img img{object-fit:contain}
.odv-root .prodcard .ph .soon{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--navy)}
.odv-root .prodcard .ph .soon b{font-size:34px;font-weight:800;letter-spacing:.04em}
.odv-root .sp{display:inline-flex;align-items:center;font-style:normal;font-weight:700;letter-spacing:.02em;background:var(--navy);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;line-height:1.5}
.odv-root .dn{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.odv-root .dn .ds{color:var(--ink)}
.odv-root .dnh{display:flex;align-items:center;gap:7px}
.odv-root .dnh span{font-weight:800}
.odv-root .prodcard .ph .soon .nm{display:flex;align-items:center;gap:10px}
.odv-root .prodcard .ph .soon .nm .sp{font-size:16px;padding:5px 13px;letter-spacing:.04em}
.odv-root .prodcard .ph .soon span{font-size:12.5px;color:var(--mute)}
.odv-root .prodcard .ph .flag{position:absolute;left:14px;top:14px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 10px}
.odv-root .prodcard .ph .flag.alt{background:#fff;color:var(--navy)}
.odv-root .prodcard .bd{padding:20px 18px 18px}
.odv-root .prodcard .eyeb{font-size:12px;color:var(--soft);font-weight:500}
.odv-root .prodcard h3{margin:4px 0 0;font-size:19px;font-weight:800;letter-spacing:-.04em}
.odv-root .prodcard .sub{margin-top:2px;font-size:13.5px;color:var(--mute)}
.odv-root .ings{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.odv-root .ings span{font-size:12px;background:var(--tint);color:var(--navy);border-radius:999px;padding:5px 10px;font-weight:600}
.odv-root .prodcard .why{margin:12px 0 0;font-size:14px;line-height:1.75;color:var(--ink)}
.odv-root .slot{margin-top:10px;display:flex;gap:8px;align-items:flex-start;background:var(--tint);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--mute)}
.odv-root .slot b{flex:none;color:var(--navy);font-weight:700}
.odv-root .btns{margin-top:14px;display:grid;gap:8px}
.odv-root .alsoin{border-top:1px solid var(--line);padding:16px 18px 18px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.odv-root .alsoin img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.odv-root .alsoin b{font-size:14.5px;font-weight:700}
.odv-root .alsoin p{margin:2px 0 0;font-size:12.5px;line-height:1.5;color:var(--mute)}
.odv-root .alsoin a{grid-column:1/-1;font-size:13.5px;font-weight:600;text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:11px 0;text-decoration:none}
.odv-root .revs{border-top:1px solid var(--line);padding:18px}
.odv-root .revs .rh{display:flex;justify-content:space-between;align-items:center}
.odv-root .revs .rh b{font-size:15px;font-weight:700}
.odv-root .revs .rh a{font-size:12.5px;text-decoration:none;color:var(--soft)}
.odv-root .rsum{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.odv-root .rsum b{font-size:15px;color:var(--ink,#111)}
.odv-root .stars{color:#1F3A5F;letter-spacing:1px;font-size:13px}
.odv-root .stars i{font-style:normal;color:#D5DEE8}
.odv-root .rstrip{margin:12px -18px 0;padding:0 18px 2px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.odv-root .rstrip::-webkit-scrollbar{display:none}
.odv-root .rstrip button,.odv-root .rph button{flex:0 0 auto;padding:0;border:0;background:var(--tint);border-radius:12px;overflow:hidden;cursor:zoom-in}
.odv-root .rstrip button{width:84px;height:84px}
.odv-root .rstrip img,.odv-root .rph img{display:block;width:100%;height:100%;object-fit:cover}
.odv-root .rsec{margin-top:16px;font-size:12.5px;font-weight:700;color:var(--navy)}
.odv-root .rv{margin-top:10px;background:var(--tint);border-radius:16px;padding:14px}
.odv-root .rtop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--soft)}
.odv-root .rtop .who{color:var(--mute);font-weight:600}
.odv-root .rtop .tag{margin-left:auto;background:var(--paper);border-radius:999px;padding:2px 8px;font-size:11px}
.odv-root .rdir{margin-top:8px;display:inline-block;background:var(--paper);color:var(--navy);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}
.odv-root .rph{margin-top:10px;display:flex;gap:6px;align-items:center}

/* 방향 결정: 장벽이 흔들린 상태(Calm 필요, Shield 2단계 이상, 수분 부족 2단계 이상)면 자극이 큰 OUT·UP은 한 단계 낮춰 비교한다. */
function decide(a){
  const s = scoreOf(a);
  const O = ORDER;
  const gate = s.DOWN>0 || s.ON>=2 || s.IN>=2;
  const eff = Object.fromEntries(ORDER.map(k => [k, (gate && (k==="OUT"||k==="UP")) ? Math.max(0, s[k]-1) : s[k]]));
  const rank = [...O].sort((x,y) => eff[y]-eff[x] || O.indexOf(x)-O.indexOf(y));
  const p = eff[rank[0]] > 0 ? rank[0] : "IN";
  const ties = rank.filter(k => k!==p && eff[k]===eff[p] && eff[p]>0);
  const gated = gate ? ["OUT","UP"].filter(k => k!==p && s[k] > eff[p]) : [];
  const second = rank.find(k => k!==p && eff[k]>0) || null;
  return {s, eff, p, ties, gated, second, zero: eff[rank[0]]===0};
}

         "특정 시기에만 몰린다면 호르몬과 스트레스 리듬의 영향일 가능성이 큽니다. 평소 루틴은 그대로 두고, 그 시기에만 피지 조절 단계를 아침·저녁 모두 쓰는 식으로 주기에 맞추세요.",
         "피지 분비는 피부 온도가 오르면 늘어나는 것으로 알려져 있습니다. 더운 계절에는 크림을 젤로 바꾸는 등 제형을 가볍게 하는 것만으로 체감이 달라집니다.",
         "과한 세안과 보습 생략은 피부를 당기게 하고 장벽을 약하게 만듭니다. 번들거림을 줄이려던 습관이 오히려 피부를 흔들고 있을 수 있으니, 세안은 하루 2회로 줄이고 보습은 유분 없는 제형으로 매일 하세요."],
    plan1:["아침에 나이아신아마이드 계열 피지 조절 세럼 하나만 추가합니다.","생리 예정일 일주일 전을 달력에 표시하고, 그 주에만 피지 조절 세럼을 아침·저녁으로 씁니다.","보습 크림을 젤 타입으로 바꾸고, 차단제도 가벼운 제형으로 고릅니다.","세안을 하루 2회로 고정하고, 유분 없는 젤 보습을 아침·저녁 넣습니다."],
    avoid:["피지를 다 닦아내려는 잦은 기름종이","생리 전 주에 새 제품 시작","더운 날 유분 많은 크림 두껍게","하루 3회 이상 세안, 보습 생략"] },
  ON:{ t:"피부 반응을 가장 자주 일으키는 계기는?",
    h:"계기를 알면 반응이 오기 전에 막을 수 있습니다.",
    o:["환절기나 급격한 기온·습도 변화","새로 바꾼 화장품","마스크·면도·손 접촉 같은 마찰","정해진 계기 없이 수시로"],
    txt:["계절에 반응한다면 환절기 2주 전부터 보호 단계를 미리 넣는 것이 가장 효과적입니다. 습도가 낮아지면 장벽 기능이 떨어지는 것으로 알려져 있어, 반응이 시작된 뒤에는 늦습니다.",
         "제품을 바꿀 때마다 반응한다면 특정 성분 문제이거나 한 번에 여러 개를 바꾸는 습관 문제일 수 있습니다. 새 제품은 하나씩, 2주 간격으로, 턱 아래 테스트 후 들이세요. 같은 성분에 반복해서 반응하면 피부과 첩포검사로 원인을 찾을 수 있습니다.",
         "마찰은 같은 자리를 매일 자극합니다. 마스크·면도 부위에 보호 크림을 먼저 바르고, 손이 얼굴에 가는 횟수를 줄이는 것이 어떤 제품보다 먼저입니다.",
         "계기 없이 수시로 반응한다면 특정 자극보다 피부의 방어력 자체가 낮아진 상태로 볼 수 있습니다. 원인을 찾기보다 루틴을 최소로 줄이고 보호 단계를 매일 고정하는 것이 먼저입니다."],
    plan1:["아침 보호 크림을 고정하고, 실내 습도를 40~60%로 맞춥니다.","최근 바꾼 제품을 모두 빼고 세안·크림·차단제 3개로 줄입니다.","마스크·면도 부위에 보호 크림을 먼저 바르고, 마스크는 매일 새것으로 씁니다.","루틴을 세안·크림·차단제 3개로 줄이고 2주간 바꾸지 않습니다."],
    avoid:["환절기에 새 제품 시작","샘플 여러 개를 같은 주에 테스트","같은 마스크 재사용, 무딘 날 면도기","피부가 괜찮은 날 여러 제품 몰아 쓰기"] },
  ON_U:{ t:"자외선 차단제는 어떻게 바르고 있나요?",
    h:"같은 차단제라도 바르는 양과 횟수에 따라 실제 차단 효과가 크게 달라집니다.",
    o:["거의 안 바르거나, 외출하는 날만 바른다","매일 바르지만 아침에 한 번, 얇게 바른다","매일 넉넉히 바르고, 외출하면 덧바른다","바르면 따갑거나 트러블이 나서 자주 못 바른다"],
    txt:["차단이 매일이 아니라면 이 방향에서 가장 큰 구멍입니다. UVA는 흐린 날과 실내 창가에도 닿기 때문에, 다른 어떤 제품보다 매일 바르는 것 하나가 먼저입니다.",
         "차단제를 시험 기준량(2mg/cm²)보다 적게 바르면 실제 차단 효과는 표시된 수치보다 크게 떨어집니다. 얼굴에 손가락 두 마디 정도로 양을 늘리는 것이 제품을 바꾸는 것보다 효과적입니다.",
         "차단 습관은 이미 잘 되어 있습니다. 그런데도 잡티가 늘고 있다면 차단만으로 막기 어려운 부분이니, 아침 항산화 단계(비타민C)를 더하고 짙어진 색소는 피부과에서 확인하세요.",
         "차단제 자체가 자극이 된다면 차단 성분이나 제형이 맞지 않는 것입니다. 무기자차(징크옥사이드·티타늄디옥사이드) 계열이 자극이 적은 편이니 턱 아래에서 테스트한 뒤 바꿔보세요."],
    plan1:["자외선 차단제를 매일 아침, 실내에 있는 날도 바릅니다. 이번 주 과제는 이것 하나입니다.","차단제 양을 손가락 두 마디로 늘립니다. 다른 건 바꾸지 않습니다.","아침 비타민C 세럼을 추가하고, 외출하는 날은 점심 무렵 한 번 덧바릅니다.","무기자차 계열 차단제로 바꾸고 턱 아래에서 3일 테스트합니다."],
    avoid:["흐린 날·실내라고 차단 생략","차단제를 얇게 한 번만","덧바르지 않고 장시간 야외","자극을 참으면서 같은 차단제 계속 쓰기"] },
  IN:{ t:"세안은 어떻게 하고 있나요?",
    h:"당김의 원인은 바르는 것보다 씻는 방식에 있는 경우가 많습니다.",
    o:["뜨거운 물로, 거품 많은 세안제로 씻는다","하루 2번 이상 세안제로 씻는다","미지근한 물에 순한 세안제로 씻는다","세안은 괜찮은데, 씻고 나서 보습까지 5분 넘게 걸린다"],
    txt:["뜨거운 물과 세정력 강한 세안제는 각질층 지질을 씻어내 수분이 빠져나가게 합니다. 미지근한 물과 약산성 세안제로 바꾸는 것만으로 당김이 크게 줄 수 있습니다.",
         "세안 횟수가 많을수록 장벽 지질도 함께 씻겨 나갑니다. 아침은 물세안, 저녁만 세안제로 바꿔보세요.",
         "세안 방식은 이미 순한 편입니다. 이 경우 당김의 원인은 수분을 잡아두는 단계가 부족한 쪽이니, 수분을 끌어오는 성분과 잡아두는 성분을 함께 쓰는지 확인하세요.",
         "세안 직후에는 각질층 수분이 빠르게 증발하는 것으로 알려져 있습니다. 씻고 나서 피부가 마르기 전에 바로 수분 단계를 바르는 습관이 제품을 바꾸는 것보다 효과적입니다."],
    plan1:["세안제를 약산성으로, 물 온도를 미지근하게 바꿉니다. 다른 건 그대로 둡니다.","아침은 물세안, 저녁만 세안제로 바꿉니다.","지금 크림 성분표에서 휴멕턴트(글리세린·히알루론산)와 지질(세라마이드·스쿠알란)이 모두 있는지 확인합니다.","세안 후 1분 안에 수분 세럼을 바르는 것을 습관으로 만듭니다."],
    avoid:["40도 이상 뜨거운 물 세안","하루 3회 이상 세안제 사용","당김을 참고 크림만 늘리기","세안 후 수건으로 세게 문지르기"] },
  OUT:{ t:"가장 신경 쓰이는 것은 어느 쪽인가요?",
    h:"막힌 모공, 거친 결·탁한 톤, 염증성 트러블은 맞는 성분과 강도가 각각 다릅니다.",
    o:["코·턱의 블랙헤드와 막힌 모공","모공보다 결이 거칠고 톤이 탁한 것","붉고 아픈 트러블과 그 뒤에 남는 자국","생리 전후나 계절마다 막힘이 심해졌다 좋아졌다 한다"],
    txt:["막힌 모공이 중심이라면 기름에 녹는 BHA(살리실산)가 모공 안 피지까지 녹여 가장 잘 맞습니다. 막힌 부위에만 주 1~2회부터 쓰세요.",
         "결과 톤이 중심이라면 모공보다 표면 각질이 늦게 떨어지는 쪽입니다. 물에 녹는 AHA·PHA가 각질층 표면을 정돈하는 데 맞고, 자극이 걱정되면 PHA부터 시작하세요. 산 성분을 쓰는 동안은 자외선에 예민해지니 차단을 빼지 마세요.",
         "염증성 트러블이 중심이라면 각질 케어만으로는 한계가 있습니다. 반복되는 염증성 여드름과 자국은 피부과 치료가 효과와 속도 모두에서 앞서니 진료를 권하고, 홈케어는 순한 세안과 저농도 BHA로 돕는 정도로 두세요.",
         "주기적으로 심해진다면 피지 분비 리듬의 영향이 큽니다. 심해지기 전 주에 각질 케어를 한 번 넣어두는 식으로 주기에 맞추면 효율적입니다."],
    plan1:["저녁 이중 세안을 도입하고, 코·턱에만 BHA를 주 1회 바릅니다.","주 1회 PHA 각질 케어를 시작하고, 아침 자외선 차단을 고정합니다.","트러블 부위는 손대지 않고, 이번 주 안에 피부과 상담 일정을 잡습니다.","생리 예정일 일주일 전을 표시하고, 그 주에 BHA를 한 번 더 넣습니다."],
    avoid:["코팩, 손으로 압출","AHA를 쓰는 동안 자외선 차단 생략","트러블 짜기, 자국 부위 스크럽","심해진 주에 각질 제품 몰아 쓰기"] },
  OFF:{ t:"저녁 세안의 횟수와 강도는 어떤가요?",
    h:"OFF는 덜 지우는 것만큼 과하게 씻는 것도 문제입니다. 둘 다 피부 위의 균형을 무너뜨립니다.",
    o:["대충 한 번 씻거나, 피곤한 날은 건너뛴다","한 번 씻지만 꼼꼼히 한다","두세 번 씻거나 세게 문질러야 개운하다","클렌징 티슈나 워터로 닦아내고 끝낸다"],
    txt:["건너뛴 날의 잔여물은 다음 날 위에 쌓입니다. 무엇을 쓰느냐보다 매일 저녁 한 번은 제대로 씻는 것이 이 방향의 시작입니다.",
         "꼼꼼히 씻어도 폼 한 번으로는 기름에 녹는 차단제와 메이크업이 남기 쉽습니다. 오일이나 밤으로 1차 세안을 더하면 문지르는 횟수를 늘리지 않고도 잘 지워집니다.",
         "잔여감 때문에 여러 번, 세게 씻고 있다면 지우는 방식이 맞지 않는 것입니다. 횟수와 마찰이 늘면 장벽이 손상될 수 있으니, 오일이나 밤으로 녹여서 한 번에 지우고 2차 세안은 30초 안에 끝내세요.",
         "닦아내는 방식은 마찰은 주고 잔여물은 남기기 쉽습니다. 오일이나 밤으로 녹인 뒤 물로 헹구는 방식으로 바꾸는 것이 피부에도 세정에도 낫습니다."],
    plan1:["저녁에 세안제로 한 번 씻는 것을 매일 지킵니다. 이번 주 과제는 이것 하나입니다.","저녁 1차 세안을 오일 또는 밤으로 추가합니다. 폼은 그대로 둡니다.","세안을 오일·밤 1차와 폼 2차, 딱 두 번으로 줄이고 문지르는 시간을 짧게 합니다.","클렌징 티슈를 오일 또는 밤으로 바꾸고, 물에 유화시켜 헹굽니다."],

  UP:{ t:"탄력 관리는 지금 어디까지 해봤나요?",

    o:["자외선 차단과 보습 정도","레티놀을 써봤는데 따갑거나 각질이 일어나 그만뒀다","레티놀·펩타이드 등 여러 제품을 쓰는데 효과를 모르겠다","레이저·리프팅 같은 피부과 시술을 받고 있다"],

         "탄력 성분은 체감까지 보통 8~12주가 걸립니다. 여러 개를 한 번에 쓰면 무엇이 효과이고 무엇이 자극인지 알 수 없으니, 저녁 레티놀 하나와 아침 차단만 남기고 12주를 지켜보세요.",

    plan1:["자외선 차단제를 매일로 고정합니다. 레티놀은 다음 주부터 시작합니다.","보습 크림을 먼저 바르고 그 위에 저농도 레티놀을 주 2회만 바릅니다.","탄력 제품을 저녁 레티놀 하나로 줄이고 나머지는 잠시 쉽니다.","시술 일정을 기준으로 전후 1주는 레티놀을 쉬고 차단과 보습만 유지합니다."],

    plan:["루틴을 세안·크림·차단제 3개로 줄입니다. 반응이 줄어드는지 봅니다.","보호 크림을 아침에 고정하고, 차단제를 매일로 바꿉니다.","그동안 빼둔 제품 중 하나만 턱 아래 테스트 후 복귀시킵니다.","환절기나 마스크 상황에서 반응이 줄었으면 보호가 작동하는 겁니다. 다음 방향으로 넘어갈 준비가 된 상태입니다."]},
  OFF:{
    next:"OUT",
    q:"지금 피부에 먼저 필요한 것은 제대로 지우는 일입니다. 남은 것이 있는 한 바르는 것은 닿지 않습니다.",
    basis:[["피부 지표","표면 잔여물(피지·차단제·메이크업) 제거, 세정 후 피부 pH"],["작용 층","피부 표면"],["핵심 기전","유성 잔여물은 오일 계열로 녹이고, 수성 잔여물은 계면활성제로 씻어냅니다. 세정 후 피부 pH가 약산성으로 유지되는 것이 중요합니다"],["성분군","클렌징 오일·밤(에스테르 오일), 약산성 계면활성제(아미노산계), 저자극 폼"]],
    age:["10대는 피지가 많아 세안이 중요하지만 세게 자주 씻으면 오히려 자극이 됩니다. 저녁 한 번 꼼꼼히, 메이크업을 했다면 순한 1차 세안을 더하세요.","20대는 피지가 많아 세안의 비중이 큰 시기입니다. 대신 세게 하면 자극이 되니 '녹여서 헹구는' 방식으로.","30대는 피지는 줄지만 메이크업은 늘어나는 시기입니다. 세정력보다 '제대로 지우되 당기지 않는' 균형이 필요합니다.","40대 이후는 세안이 과하면 바로 건조로 이어집니다. 1차는 밤 타입으로 부드럽게, 2차는 저자극 약산성으로.","50대 이후는 세안이 조금만 과해도 바로 당김으로 이어집니다. 1차는 밤 타입으로 짧게, 2차는 저자극 약산성으로 가볍게 하고, 아침은 물세안이면 충분합니다."],
    env:["냉난방 실내는 피지와 먼지가 적어 세안이 과하기 쉽습니다. 아침은 물세안, 저녁만 이중 세안이면 충분합니다.","야외 먼지와 땀은 차단제와 섞여 피부 위에 막을 만듭니다. 귀가 직후 1차 세안을 먼저 하세요.","마스크 안쪽은 습기와 피지가 갇혀 턱·입 주변에 잔여물이 가장 많이 남습니다. 그 부위를 1차 세안에서 가장 오래 녹이세요.","땀은 차단제·피지와 섞여 피부 위에 꽤 두꺼운 막을 남깁니다. 운동 뒤 물세안만으로 끝내지 말고 그날 저녁은 반드시 1차 세안을 넣으세요.","수면이 부족한 날은 세안을 대충 하거나 건너뛰기 쉽습니다. 귀가 직후 세안부터 하는 습관이 어떤 제품보다 큰 차이를 만듭니다.","바쁘고 지친 시기에는 세안을 대충 하거나 건너뛰기 쉽습니다. 단계를 늘리기보다 '귀가 직후 1차 세안' 하나만 습관으로 고정하세요. 음주한 날은 세안을 빠뜨리기 가장 쉬운 날입니다. 담배 연기 성분은 피부 표면에 남아 피지와 섞이기 쉽습니다.","임신·수유 중이라면 향이 강하지 않은 순한 클렌징 오일이나 밤과 약산성 세안제 조합이 무난한 편입니다. 피부가 예민해지기 쉬운 시기이니 문지르는 시간을 짧게 하세요.","생리 전후에는 피지가 늘어 잔여감이 더 심해질 수 있습니다. 그 주에는 1차 세안 시간을 조금 늘리고 유화를 꼼꼼히 하세요.","규칙적인 생활이라면 세안 방식만 바꾸면 됩니다. 1차 세안 추가와 유화, 두 가지입니다."],
    avoid:["하루 3회 이상 세안, 강한 거품 세안제","클렌징 티슈로 문질러 닦기","세안 뒤 보습 생략"],
    am:["물세안 또는 아주 순한 약산성 세안제","가벼운 토너","가벼운 수분 보습","논코메도제닉 자외선 차단제"],
    pm:["클렌징 오일 또는 밤으로 1분간 녹이기(1차)","물을 묻혀 유화시킨 뒤 헹구기","약산성 폼으로 2차, 30초 이내","수분 세럼","가벼운 보습 크림"],
    plan:["저녁 1차 세안을 오일 또는 밤으로 바꿉니다. 다른 건 그대로.","1차 뒤 유화 단계를 넣습니다. 물을 묻혀 하얗게 변할 때까지 문지른 뒤 헹굽니다.","세안 뒤 보습을 빼지 않습니다. 지웠으면 반드시 가볍게 채웁니다.","세안 직후 코 옆을 티슈로 눌러보세요. 기름기가 묻어나지 않으면 지워진 겁니다. 이제 OUT 방향으로 넘어갈 준비가 됐습니다."]},
  UP:{
    next:"ON_U",
    q:"지금 피부에 필요한 것은 채우는 일이 아니라 끌어올리는 일입니다. 관리의 방향을 바꿀 때입니다.",
    basis:[["피부 지표","피부 탄력도(Cutometer R2), 주름 깊이"],["작용 층","진피"],["핵심 기전","레티노이드는 진피 콜라겐 생성을 촉진하고 분해를 억제하는 것으로 알려져 있습니다. 자외선 차단은 탄력 섬유의 손상을 막는 가장 확실한 예방입니다"],["성분군","레티놀·레티날, 펩타이드, 비타민C, 자외선 차단 성분"]],
    age:["10대의 탄력 고민은 대부분 수면·체중·자세 같은 생활 요인입니다. 탄력 제품보다 자외선 차단과 충분한 수면이 가장 좋은 예방입니다.","20대의 탄력 고민은 수면 부족과 체중 변화 요인이 큰 편입니다. 고농도 탄력 제품보다 자외선 차단과 수면이 먼저입니다.","30대는 콜라겐 생성이 줄기 시작하는 시기로 알려져 있습니다. 저농도 레티놀을 지금 시작하면 이후가 달라집니다.","40대 이후는 탄력 저하가 진행된 상태입니다. 레티놀 농도를 올리되 보습을 같이 챙기지 않으면 자극으로 중단하게 됩니다.","50대 이후는 갱년기 전후의 변화로 콜라겐과 수분이 함께 줄어드는 시기로 알려져 있습니다. 탄력 단계와 함께 보습을 리치하게, 레티놀은 자극을 보며 천천히 올리세요."],
    env:["냉난방 실내 건조는 잔주름을 더 깊어 보이게 합니다. 탄력 제품 위에 보습을 빼지 마세요.","야외 자외선은 탄력 섬유 손상의 가장 큰 외부 요인입니다. 이 방향에서 자외선 차단은 선택이 아니라 가장 중요한 단계입니다.","마스크를 오래 쓰면 입가 마찰과 습기로 그 부위 결이 거칠어지기 쉽습니다. 벗은 뒤 입가부터 보습하세요.","야외 운동이 많다면 자외선 누적이 탄력 저하의 가장 큰 요인입니다. 땀에 강한 차단제를 고르고 운동 중에도 덧바르세요.","수면 중 피부 재생이 집중되는 것으로 알려져 있어, 수면 부족은 탄력 관리의 효과를 직접 깎습니다. 어떤 세럼보다 수면 시간 확보가 먼저입니다.","만성 스트레스와 그에 따른 수면 부족은 피부 회복을 늦추는 요인으로 알려져 있습니다. 탄력 제품을 늘리기보다 수면과 자외선 차단을 먼저 지키세요. 잦은 음주는 피부 수분과 회복에 불리한 요인으로 알려져 있습니다. 흡연은 콜라겐 분해를 촉진하고 피부 노화를 앞당기는 요인으로 여러 연구에서 보고되어 있습니다.","임신·수유 중에는 레티놀·레티날 같은 레티노이드 계열을 쓰지 않는 것이 일반적인 권고입니다. 이 기간에는 자외선 차단, 보습, 펩타이드처럼 부담이 적은 성분으로 유지하고 성분 선택은 담당 의사와 상의하세요. 아래 루틴의 레티놀 단계는 대체해 표시했습니다.","갱년기 전후에는 에스트로겐 감소와 함께 피부 콜라겐과 수분이 줄어드는 것으로 알려져 있습니다. 탄력 단계와 함께 보습을 한 단계 더 리치하게 가져가세요.","규칙적인 생활이라면 탄력 관리에 유리한 조건입니다. 자외선 차단과 레티놀, 두 축만 꾸준히 가면 됩니다."],
    avoid:["강한 마사지 기구를 매일","탄력 제품 여러 개를 한 번에 시작","자외선 차단 생략"],
    am:["물세안 또는 약산성 세안제","비타민C 또는 펩타이드 세럼","보습 크림","자외선 차단제 넉넉히"],
    pm:["약산성 세안제 1회","수분 토너","레티놀 또는 레티날 세럼(저농도, 주 2회부터)","영양 크림, 아래에서 위로"],
    plan:["자외선 차단제를 매일로 고정합니다. 이것 없이는 뒤가 소용없습니다.","저녁에 저농도 레티놀을 주 2회 넣습니다. 각질이 일면 횟수를 줄입니다.","아침 비타민C 또는 펩타이드 세럼을 추가합니다. 저녁 레티놀과 겹치지 않게.","레티놀 횟수를 주 3회로 올립니다. 체감은 8주 뒤부터이니 지금은 자극 여부만 봅니다."]},
  DOWN:{

    basis:[["피부 지표","홍반 지수(Mexameter), 피부 표면 온도 (Calm)"],["작용 층","피부 반응"],["핵심 기전","붉은기와 열감을 완화하는 것으로 알려진 성분으로 자극 반응을 가라앉히고, 자극 요인을 루틴에서 제거합니다"],["성분군","판테놀, 센텔라(마데카소사이드), 알란토인, 비사보롤, 감초 추출물"]],
    age:["10대의 붉은기는 여드름과 함께 오는 경우가 많습니다. 짜거나 만지지 않는 것이 가장 중요하고, 염증성 여드름이 반복되면 피부과 진료가 빠릅니다.","20대의 붉은기는 트러블과 함께 오는 경우가 많습니다. 짜거나 만지지 않는 것만으로 회복이 빨라집니다.","30대 붉은기는 자극 반응과 호르몬 변동이 섞이기 쉽습니다. 주기와 겹치는지 두 달만 기록해보면 원인이 보입니다.","40대 이후 반복되는 붉은기는 진정 제품으로 변화가 없다면 전문의 상담이 빠릅니다.","50대 이후 열감과 붉은기는 갱년기 변화와 겹치는 경우가 많습니다. 진정 제품으로 변화가 없다면 전문의 상담을 권합니다."],
    env:["냉난방 실내는 건조로 붉은기를 악화시킬 수 있습니다. 진정 뒤 보습을 빼지 마세요.","야외 자외선은 붉은기를 키우는 요인입니다. 달아올라 있는 동안은 양산·모자로 물리적으로 가리세요. 차단제도 자극이 될 수 있습니다.","마스크 속 열과 습기는 붉은기를 키웁니다. 가능하면 자주 벗어 식히고, 하루 한 번은 새 마스크로 바꾸세요.","운동으로 오른 피부 온도는 붉은기를 키웁니다. 달아올라 있는 동안은 고강도 운동을 줄이고, 끝난 뒤 미지근한 물로 식히세요.","수면 부족은 피부 반응을 예민하게 만들어 붉은기가 오래 갑니다. 진정 제품보다 이틀 연속 충분한 수면이 더 큰 차이를 낼 수 있습니다.","스트레스는 붉은기와 트러블을 키우는 요인으로 알려져 있습니다. 가라앉을 때까지 새 제품은 멈추고 세안·진정·보습 세 가지만 유지하세요. 음주와 카페인은 붉은기와 열감을 키우는 요인입니다. 흡연은 피부 회복을 늦추는 요인으로 알려져 있습니다.","임신·수유 중에는 피부가 예민해져 붉은기가 쉽게 올라올 수 있습니다. 진정 단계는 판테놀·센텔라처럼 순한 성분 위주로, 새 제품은 턱 아래에서 테스트한 뒤 쓰고 반응이 계속되면 담당 의사와 상의하세요.","생리 전후나 갱년기의 열감·붉은기는 호르몬 변화와 관련된 경우가 많습니다. 반복되는 시기를 두 달만 기록해보면 미리 진정 루틴으로 바꿀 때가 보입니다. 갱년기 열감이 잦다면 전문의 상담도 함께 고려하세요.","규칙적인 생활이라면 원인은 생활보다 제품이나 환경 쪽일 가능성이 큽니다. 최근 바꾼 것을 먼저 의심하세요."],
    avoid:["레티놀·비타민C·산 계열 전부","뜨거운 물, 사우나, 격한 운동 직후 세안","마스크팩, 특히 시트팩 매일"],

const app = document.getElementById("odv-app");
const ROOT = app.closest(".odv-root") || document.body;
/* 아임웹 상단 고정 헤더 높이. 질문을 넘길 때 위젯 맨 위가 헤더에 가리지 않게 이만큼 띄운다. */
const HEAD_OFF = window.innerWidth < 768 ? 60 : 80;
const jump = (y, b) => { try{ window.scrollTo({top: Math.max(0, y), behavior: b}); }catch(e){ window.scrollTo(0, Math.max(0, y)); } };
const AXL = ["반응","수분","피지","모공","잔여","탄력","색소"];
const BASE = {IN:0, OUT:60, ON:120, OFF:180, UP:240, DOWN:300};
const ROLE = {
  OFF:"피부 위에 남은 것을 지우는 방향", ON:"자극에서 장벽을 지키는 방향", IN:"각질층에 수분을 채우는 방향",
  DOWN:"올라온 열감과 붉은기를 가라앉히는 방향", ON_U:"자외선이 쌓이지 않게 막는 방향",
  DOWN_S:"피지가 나오는 양을 조절하는 방향", OUT:"모공에 쌓인 것을 비우는 방향", UP:"탄력을 지키고 끌어올리는 방향"
};
const pad = n => String(n).padStart(2,"0");
let pos = 0, ans = {}, dec = decide({}), dir = dec.p, fuDir = null, angle = null;
const recompute = () => { dec = decide(ans); dir = dec.p; };
const coreDone = () => AX.filter(a => ans[a.k] !== undefined).length;
const vals = () => AX.map(a => ans[a.k] ?? 0);
const subTag = k => SUB[k] ? SUB[k][0] : (k==="IN" && !dec.zero ? ((ans.oil ?? 0)===0 ? "Lipid" : "Water") : "");
const shortest = d => ((d % 360) + 540) % 360 - 180;
const fx = n => n.toFixed(1);
function printPts(R, v, cx=150, cy=150){
  return v.map((x,i)=>{ const a=(-90 + i*360/7)*Math.PI/180, r=R*Math.max(.05, x/3); return `${fx(cx+Math.cos(a)*r)},${fx(cy+Math.sin(a)*r)}`; }).join(" ");
}
function targetAngle(){
  if(coreDone()===0) return null;
  let t = BASE[show(dir)];
  if(dec.second && !dec.zero){ const s2 = BASE[show(dec.second)]; if(s2!==t) t += Math.sign(shortest(s2 - t)) * 10; }
  return t;
}
const backIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;
const arrowR = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M14 6l6 6-6 6"/></svg>`;

/* 나침반(단순형): 얇은 원 + 방향 점 6개 + 바늘. 방향 이름은 둘레에 글자만, 가리키는 방향만 네이비 알약으로 켠다. */
function compass(W, o={}){
  const on = o.on ?? (coreDone()>0 ? show(dir) : null), lit = !!o.lit;
  const R = W*0.43, s = W*0.70;
  const labels = Object.keys(BASE).map(k=>{ const a=BASE[k]*Math.PI/180; return `<span class="chip ${k===on?"on":""} ${lit&&k!==on?"dim":""}" style="left:${fx(W/2+Math.sin(a)*R)}px;top:${fx(W/2-Math.cos(a)*R)}px">${k}</span>`; }).join("");
  const dots = Object.keys(BASE).map(k=>{ const a=BASE[k]*Math.PI/180; return `<circle cx="${fx(150+Math.sin(a)*132)}" cy="${fx(150-Math.cos(a)*132)}" r="${k===on?6:3.5}" fill="${k===on?"#1B3A5C":"#C3D0DE"}"/>`; }).join("");
  return `<div class="compass" style="width:${W}px;height:${W}px">
    <svg width="${s}" height="${s}" viewBox="0 0 300 300" role="img" aria-label="${on?`바늘이 ${on} 쪽을 가리키는 나침반`:"아직 방향이 정해지지 않은 나침반"}">
      <circle cx="150" cy="150" r="132" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="1.5"/>
      ${dots}
      <g class="needle ${o.wob?"wob":""}" id="needle" style="transform:rotate(${o.from ?? angle ?? 0}deg)">
        <polygon points="150,40 158,150 142,150" fill="#1B3A5C"/>
        <polygon points="150,212 156,150 144,150" fill="#C9DBEC"/>
      </g>
      <circle cx="150" cy="150" r="9" fill="#FFFFFF" stroke="#1B3A5C" stroke-width="2.4"/>
    </svg>${labels}</div>`;
}
function moveNeedle(){
  const n = document.getElementById("needle"), t = targetAngle();
  if(!n) return;
  if(t===null){ n.classList.add("wob"); return; }
  const next = angle===null ? t : angle + shortest(t - angle);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ n.style.transform = `rotate(${next}deg)`; }));
  angle = next;
}
function go(n){
  app.classList.remove("rs");
  pos = n; render();
  jump(ROOT.getBoundingClientRect().top + window.scrollY - HEAD_OFF, "instant");
  /* 질문 화면: 선택지가 화면 아래로 잘리면, 선택지 끝이 화면 안에 들어오도록 바로 내려준다. */
  const box = app.querySelector(".opts");
  if(box && pos>=1 && pos<=10){
    requestAnimationFrame(()=>{
      const r = box.getBoundingClientRect(), vh = window.innerHeight;
      if(r.bottom > vh - 12){ const card = app.querySelector(".qcard").getBoundingClientRect(); const d = Math.min(r.bottom - vh + 20, card.top - 8 - HEAD_OFF); if(d > 0) jump(window.scrollY + d, "smooth"); }
    });
  }
}
function wireOpts(fn){ app.querySelectorAll(".opt").forEach(b => b.onclick = () => { app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); setTimeout(()=>fn(+b.dataset.i), 220); }); }
function wireBack(){ const b = document.getElementById("back"); if(b) b.onclick = () => go(pos-1); }
function render(){
  if(pos===0) return intro();
  if(pos<=7) return core(pos-1);
  if(pos===8) return followUp();
  if(pos===9) return outside("age");
  if(pos===10) return outside("env");
  return result();
}
const topBar = n => `<div class="qtop"><button class="back" id="back" aria-label="이전">${backIcon}</button><div class="pbar">${Array.from({length:10},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div><span class="pnum"><b>${n}</b>/10</span></div>`;
const lean = () => coreDone()===0 ? `<div class="lean">답을 고르면 바늘이 움직여요</div>` : `<div class="lean">지금 <b>${lbl(dir)}</b> 쪽으로 기울고 있어요<small>${subOf(dir)}</small></div>`;
const opts = (list, picked, o={}) => `<div class="opts ${o.cls||""}">${list.map((t,j)=>`<button class="opt ${picked===j?"sel":""}" data-i="${j}">${o.lv?`<span class="lv" aria-hidden="true">${[1,2,3].map(n=>`<i class="${j>=n?"on":""}"></i>`).join("")}</span>`:""}<span>${t}</span></button>`).join("")}</div>`;

function intro(){
  angle = null;
  app.innerHTML = `<div class="intro" style="min-height:0;padding-bottom:112px">
    <div class="brand pop">ONDIREV</div>
    <div class="pop d1" style="margin-top:12px">${compass(260,{wob:true,on:null})}</div>
    <h1 class="pop d2">내 피부는 지금<br><span>어느 방향</span>이 필요할까요?</h1>
    <p class="lead pop d2">질문에 답하면 바늘이 내 피부의 방향을 가리켜요.</p>
    <div class="steps3 pop d3"><div><b>10</b>가지 질문에<br>답해요</div><div><b>1</b>개의 방향을<br>찾아요</div><div><b>4</b>주 루틴을<br>받아요</div></div>
    <div class="gobar"><div class="gobar-in"><button class="cta" id="go">내 방향 찾기 ${arrowR}</button>
    <div class="meta">약 3분 · 로그인 없이 바로</div></div></div>
  </div>`;
  document.body.classList.add("odv-intro-on");
  document.getElementById("go").onclick = () => { document.body.classList.remove("odv-intro-on"); track("check_start"); ans = {}; fuDir = null; recompute(); go(1); };
}

function core(i){
  const q = AX[i];
  app.innerHTML = `${topBar(i+1)}
    <div style="margin-top:4px">${compass(176,{wob:coreDone()===0})}</div>
    ${lean()}
    <section class="qcard pop">
      <span class="qtag">${AXL[i]} 신호 · ${i+1}/7</span>
      <h2>${q.t}</h2><p class="hint">${q.h}</p>
      ${opts(q.o, ans[q.k], {lv:true})}
    </section>
    <div class="qfoot">막대가 많을수록 그 신호가 강하다는 뜻이에요</div>`;
  moveNeedle(); wireBack();
  wireOpts(j => { track("check_answer", {step: pos, question: q.k, pick: j+1}); ans[q.k] = j; recompute(); if(pos===7) track("check_direction", {direction: show(dir), subtype: dir}); go(pos+1); });
}

function followUp(){
  if(fuDir!==dir) delete ans.fu;
  const f = FU[dir];
  app.innerHTML = `${topBar(8)}
    <div style="margin-top:4px">${compass(160)}</div>
    <div class="lean">바늘이 <b>${lbl(dir)}</b>을 가리키고 있어요<small>이 방향에 맞춰 하나만 더 물어볼게요</small></div>
    <section class="qcard pop">
      <span class="qtag">${icon(show(dir),13)}${lbl(dir)} 맞춤 질문</span>
      <h2>${f.t}</h2><p class="hint">${f.h}</p>
      ${opts(f.o, ans.fu)}
    </section>`;
  moveNeedle(); wireBack();
  wireOpts(j => { track("check_answer", {step: 8, question: "fu_" + dir, pick: j+1}); ans.fu = j; fuDir = dir; go(9); });
}

function outside(kind){
  const c = kind==="age" ? C[0] : C[1];
  app.innerHTML = `${topBar(kind==="age"?9:10)}
    <section class="qcard pop" style="margin-top:16px">
      <span class="qtag">${kind==="age"?"루틴 세기 맞추기":"마지막 질문"}</span>
      <h2>${c.t}</h2><p class="hint">${c.h}</p>
      ${opts(c.o, ans[c.k], {cls: kind==="age"?"grid":"tight"})}
    </section>
    <div class="qfoot">${kind==="age"?"방향은 정해졌어요. 루틴의 세기만 맞추는 중이에요":"고르면 바로 결과가 나와요"}</div>`;
  wireBack();
  wireOpts(j => { track("check_answer", {step: pos, question: c.k, pick: j+1}); ans[c.k] = j; go(pos+1); });
}

/* 리뷰 사진 크게 보기 */
function showZoom(src, hint){
  const o = document.createElement("div"); o.className = "zoom";
  o.innerHTML = `<img src="${src}" alt="">${hint?`<p>${hint}</p>`:""}`;
  o.addEventListener("click", (e) => { if(e.target.tagName!=="IMG") o.remove(); });
  ROOT.appendChild(o);
}
document.addEventListener("click", (e) => {
  const z = e.target.closest("[data-zoom]");
  if(z){ showZoom(z.dataset.zoom); }
});

/* ── 내 방향 카드: 공유 · 저장 ─────────────────────────────
   휴대폰: 시스템 공유 창(카카오톡·인스타·메시지, '이미지 저장' 포함)으로 카드 이미지를 보낸다.
   공유 창이 없는 환경: 링크 복사 / 다운로드, 그것도 막히면 이미지를 크게 띄워 길게 눌러 저장하게 한다. */
const SHARE_URL = /ondirev\.com$/.test(location.hostname) ? location.href.split("#")[0] : "https://www.ondirev.com/directioncheck";
const shMsg = (t) => { const m = document.getElementById("shmsg"); if(m){ m.textContent = t; clearTimeout(shMsg.t); shMsg.t = setTimeout(()=>{ m.textContent=""; }, 4000); } };
async function cardFile(url){
  const b = await (await fetch(url)).blob();
  return new File([b], `ondirev-${show(dir)}${SUB[dir]?"-"+SUB[dir][0]:""}.png`, {type:"image/png"});
}
async function shareCard(url){
  track("check_share", {direction: show(dir), subtype: dir});
  const text = `내 피부 방향은 ${lbl(dir)}. 내 방향도 찾아보기`;
  try{
    const file = await cardFile(url);
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Ondirev 방향 찾기", text:`${text}\n${SHARE_URL}`}); return; }
    if(navigator.share){ await navigator.share({title:"Ondirev 방향 찾기", text, url:SHARE_URL}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(`${text} ${SHARE_URL}`); shMsg("링크를 복사했어요. 원하는 곳에 붙여넣어 보내세요"); }
  catch(e){ shMsg("이 화면에서는 공유가 막혀 있어요. 이미지를 저장해서 보내주세요"); }
}
async function saveCard(url){
  track("check_click", {what: "save_card", direction: show(dir)});
  try{
    const file = await cardFile(url);
    if(navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      await navigator.share({files:[file]}); shMsg("공유 창에서 '이미지 저장'을 누르면 앨범에 저장돼요"); return;
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }catch(e){ if(e && e.name==="AbortError") return; }
  showZoom(url, "저장이 안 됐다면 이미지를 길게 눌러 저장하세요");
}

      <button type="button" class="cta light" id="saveBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>이미지 저장</button>
    </div>
    <p class="shmsg" id="shmsg" aria-live="polite"></p></div>

  <div style="margin-top:16px"><button class="cta light" id="again">처음부터 다시</button></div>
  <details class="refs"><summary>참고한 피부과학 문헌</summary><ol>${REFS.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join("")}</ol></details>
  <p class="disc">이 결과는 피부과학 문헌의 피부 유형·민감성 평가 기준을 참고해 설계한 자가 체크이며, 임상 검증을 거친 도구는 아닙니다. 피부 측정 기기나 의료적 판단을 대신하지 않으며, 피부 상태가 지속되거나 악화되면 피부과 전문의와 상담하세요.</p>`;
  const n = document.getElementById("needle");
  if(n) requestAnimationFrame(()=>requestAnimationFrame(()=>{ n.style.transition="transform 1.5s cubic-bezier(.25,1.7,.45,1)"; n.style.transform=`rotate(${settle}deg)`; }));
  angle = settle;
  wireBack();
  document.getElementById("again").onclick = () => { track("check_click", {what: "restart", direction: name}); go(0); };
  track("check_result", {direction: name, subtype: lbl(dir), second: dec.second || "", age: ans.age, env: ans.env});
  app.querySelectorAll("a[data-what]").forEach(a => a.addEventListener("click", () => track("check_click", {what: a.dataset.what, direction: name})));
  drawCard(v, nx).then(url => {
    const im = document.getElementById("cardimg"); if(im) im.src = url;
    const sb = document.getElementById("shareBtn"), vb = document.getElementById("saveBtn");
    if(sb) sb.onclick = () => shareCard(url);
    if(vb) vb.onclick = () => saveCard(url);
  });
}

async function drawCard(v, nx){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080, H=1920, c=document.createElement("canvas"); c.width=W; c.height=H;
  const x=c.getContext("2d"), K='Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif', L='Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  const g=x.createRadialGradient(W/2,560,60,W/2,700,1100); g.addColorStop(0,"#2F5986"); g.addColorStop(.55,"#1B3A5C"); g.addColorStop(1,"#122840");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.textAlign="center"; x.fillStyle="#FFFFFF"; x.font=`400 28px ${L}`; x.letterSpacing="15px"; x.fillText("ONDIREV", W/2+7, 120);
  x.fillStyle="#A8C8E8"; x.font=`500 24px ${L}`; x.letterSpacing="12px"; x.fillText("MY SKIN PRINT", W/2+6, 214); x.letterSpacing="0px";
  const cx=W/2, cy=650, R=300, pt=(i,r)=>{ const a=(-90+i*360/7)*Math.PI/180; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  x.beginPath(); x.arc(cx,cy,R+110,0,7); x.strokeStyle="rgba(255,255,255,.14)"; x.lineWidth=2; x.stroke();
  for(let k=0;k<72;k++){ const a=k*5*Math.PI/180, r1=R+92, r2=R+(k%12===0?78:86); x.beginPath(); x.moveTo(cx+Math.sin(a)*r1, cy-Math.cos(a)*r1); x.lineTo(cx+Math.sin(a)*r2, cy-Math.cos(a)*r2); x.strokeStyle= k%12===0 ? "rgba(255,255,255,.8)" : "rgba(255,255,255,.3)"; x.lineWidth= k%12===0 ? 3 : 2; x.stroke(); }
  [3,2,1].forEach((n,j)=>{ x.beginPath(); for(let i=0;i<7;i++){ const [px,py]=pt(i,R*n/3); i?x.lineTo(px,py):x.moveTo(px,py);} x.closePath(); x.setLineDash(j?[6,10]:[]); x.strokeStyle=`rgba(255,255,255,${[.3,.18,.14][j]})`; x.lineWidth=2; x.stroke(); });
  x.setLineDash([]);
  const pg=x.createRadialGradient(cx,cy,10,cx,cy,R); pg.addColorStop(0,"rgba(168,200,232,.7)"); pg.addColorStop(1,"rgba(168,200,232,.16)");
  x.beginPath(); for(let i=0;i<7;i++){ const [px,py]=pt(i,R*Math.max(.05,v[i]/3)); i?x.lineTo(px,py):x.moveTo(px,py);} x.closePath(); x.fillStyle=pg; x.fill(); x.strokeStyle="#FFFFFF"; x.lineWidth=4; x.lineJoin="round"; x.stroke();
  const mx=Math.max(...v);
  AXL.forEach((t,i)=>{ const [px,py]=pt(i,R+40); x.fillStyle= v[i]===mx&&mx>0 ? "#FFFFFF" : "#A8C8E8"; x.font=`${v[i]===mx&&mx>0?700:500} 32px ${K}`; x.fillText(t, px, py+11); });
  const name=show(dir), tag=subTag(dir);
  x.fillStyle="#FFFFFF"; x.font=`800 160px ${L}`; x.letterSpacing="6px"; x.fillText(name, W/2+3, 1290); x.letterSpacing="0px";
  if(tag){ x.font=`500 34px ${L}`; x.letterSpacing="6px"; const tw=x.measureText(tag).width+56; x.strokeStyle="rgba(255,255,255,.55)"; x.lineWidth=2; const bx=W/2-tw/2, by=1336; x.beginPath(); x.roundRect ? x.roundRect(bx,by,tw,62,31) : x.rect(bx,by,tw,62); x.stroke(); x.fillStyle="#FFFFFF"; x.fillText(tag, W/2+3, by+43); x.letterSpacing="0px"; }
  x.fillStyle="#DCE6F1"; x.font=`400 36px ${K}`; x.fillText(subOf(dir), W/2, tag?1470:1390);
  x.fillStyle="#A8C8E8"; x.font=`300 34px ${L}`; x.letterSpacing="8px"; x.fillText(v.join(" · "), W/2+4, 1580); x.letterSpacing="0px";
  x.strokeStyle="rgba(255,255,255,.18)"; x.lineWidth=2; x.beginPath(); x.moveTo(140,1650); x.lineTo(W-140,1650); x.stroke();
  x.fillStyle="#DCE6F1"; x.font=`400 32px ${K}`; x.fillText(`다음 방향  ${lbl(nx)}`, W/2, 1720);
  x.fillStyle="#FFFFFF"; x.font=`600 32px ${K}`; x.fillText("친구의 피부는 어떤 모양일까?", W/2, H-110);
  x.fillStyle="#A8C8E8"; x.font=`400 26px ${L}`; x.letterSpacing="3px"; x.fillText("ondirev.com/directioncheck", W/2, H-62);
  return c.toDataURL("image/png");
}
render();
